// AurOS: Ubuntu Pro's apt hook is off. docs/security/UPDATES.md
//
// This file is the conffile of ubuntu-pro-client, which cannot be removed
// from the image (gnome-software needs software-properties-gtk, which
// needs it), and whose hook ran on every `apt update` to fetch news and
// ESM data from Canonical. AurOS sends nothing to Canonical but what apt
// asks of Ubuntu's archive. The package's timers and services are masked
// in /etc/systemd/system; tools/updatepolicytest.sh canonical fails a
// build in which any of this is live.
//
// A newer ubuntu-pro-client will ask what to do about this file and be
// answered "keep ours" (rootfs/etc/apt/apt.conf.d/53auros-updates:
// --force-confold).
