# AurOS: the computer's clock (docs/security/HARDENING.md, "The clock").
#
# This is Ubuntu's chrony.conf with four deliberate differences.
#
# 1. NO `rtcsync`. Windows keeps the PC's hardware clock in LOCAL time,
#    and AurOS lives beside it. `rtcsync` makes the kernel write the
#    time into that clock every 11 minutes, in UTC, and Windows would
#    then show the wrong time for hours after she went back to it.
#    Without it this computer never writes the PC's clock at all:
#    Windows' clock stays exactly as it was.
# 2. `makestep 1 -1`: a clock that is wrong by more than a second is
#    STEPPED, whenever that is found, not only in the first three
#    updates. A PC whose clock was read in the wrong zone, or whose
#    battery died, is hours or years out; every certificate and every
#    update check (apt: "not valid yet") fails until it is put right.
# 3. `port 0` and `cmdport 0`: this computer asks for the time and never
#    answers anybody; nothing listens on the network (chronyc talks to
#    the daemon over a local socket).
# 4. Authenticated time (NTS) first, from the three servers in
#    sources.d/auros-nts.sources; Ubuntu's pool servers stay as the
#    way to get the time at all on a network that blocks NTS.

confdir /etc/chrony/conf.d

pool ntp.ubuntu.com        iburst maxsources 4
pool 0.ubuntu.pool.ntp.org iburst maxsources 1
pool 1.ubuntu.pool.ntp.org iburst maxsources 1
pool 2.ubuntu.pool.ntp.org iburst maxsources 2

# Time servers her router hands out.
sourcedir /run/chrony-dhcp
sourcedir /etc/chrony/sources.d

driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony

maxupdateskew 100.0
makestep 1 -1

port 0
cmdport 0

leapsectz right/UTC
