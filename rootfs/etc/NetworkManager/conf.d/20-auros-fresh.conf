# AurOS: NetworkManager configures a cable from scratch, always.
#
# The first desktop after a real install is the installer's own boot
# handing over: the staging kernel brings the network card up (and the
# kernel gives it an IPv6 address on its own), then AurOS starts in the
# same boot. Left alone NetworkManager finds a card that "already has an
# address", ASSUMES it ("connection-assumed", sys-iface-state external)
# and never asks the router for an IPv4 address: no default route, state
# CONNECTED_LOCAL, no clock from the network, and "Get more programs"
# could not fetch its catalogue for as long as the machine stayed up
# (RC1 and RC6 on real Windows; run 40050260949's journal).
#
# keep-configuration=no: nothing that was set up before NetworkManager
# started is taken over; the card is configured from NetworkManager's
# own profiles, the cable by DHCP. Her Wi-Fi (the keyfile the installer
# writes, D10) is a profile like any other and is unaffected: a Wi-Fi
# card has no address when NetworkManager starts. A wired profile she
# made is a profile and is kept; a wired address set by something
# outside NetworkManager is exactly what this stops honouring.
# tools/nmassumetest.sh boots the image with the card pre-configured the
# way staging leaves it, with and without this file.
[device]
keep-configuration=no
