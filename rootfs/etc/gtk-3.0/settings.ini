# AurOS: the icon theme is Adwaita, everywhere (gsettings: usr/share/glib-2.0/schemas/91_auros-icons.gschema.override;
# her own ~/.config/gtk-*/settings.ini, written by build/forge).
#
# Ubuntu's file here named Yaru, which AurOS does not ship. A GTK4 program asked for a theme
# that is not there gets hicolor and nothing else, so GNOME Software drew the "image missing"
# glyph for its stars and its Flathub source. tools/hardentest.sh checks that every setting
# names a theme that is in /usr/share/icons and that starred-symbolic resolves in it.
[Settings]
gtk-icon-theme-name=Adwaita
gtk-theme-name=Adwaita
