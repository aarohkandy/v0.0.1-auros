# No crash reporter, in any program she starts from the desktop.
#
# When Firefox crashes (and it "crashes" whenever the desktop closes a
# page by force: it loses its connection to the screen) Mozilla's own
# crash window appears with "Tell Mozilla about this crash" and "Include
# the address of the page I was on" ALREADY TICKED, and a crash report
# and a crash ping are queued for Mozilla's servers. The address could
# be her bank's. There is no policy that turns that window off; the one
# switch is this variable, which stops Firefox installing its crash
# handler at all (nothing is written, nothing is sent, no window).
#
# aurshell is every program's parent, so its environment is theirs.
# Shown on the real Firefox 158 by tools/scamtest/firefoxlive.py (the
# crash window with it unset; no window, no dump with it set).
[Service]
Environment=MOZ_CRASHREPORTER_DISABLE=1
