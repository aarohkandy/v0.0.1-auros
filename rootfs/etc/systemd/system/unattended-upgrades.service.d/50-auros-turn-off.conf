# AurOS: TURN OFF MUST NOT WAIT HALF AN HOUR FOR NOTHING.
#
# This unit is Ubuntu's unattended-upgrade-shutdown: it holds a shutdown
# back while an update is installing (TimeoutStopSec=1800). Started in
# the same second as a shutdown -- Turn off pressed as the desktop
# appears, a restart from "Put Windows back" -- it loses the shutdown
# and waits for it anyway. Seen in tools/putbacktest.sh's boot 6, about
# one run in three: its own log said "Could not get delay inhibitor
# lock" and "Unable to monitor PrepareForShutdown() signal, polling
# instead" (logind was already going), and nothing more. The SIGTERM
# that stops it had been taken by the GLib handler it installs first,
# whose main loop the polling fallback never runs; the polling asks a
# logind that is gone, and that loop has no countdown. The machine
# stayed on, black, until systemd's 30 minutes ran out.
#
# So the stop does what the helper would have done had it heard it:
# no unattended-upgrade running means nothing to wait for, and the
# helper is killed (SIGKILL, which no handler takes). One running, and
# this changes nothing: the helper holds the shutdown as Ubuntu meant.
[Service]
ExecStop=-/bin/sh -c 'p=$(cat /run/unattended-upgrades.pid 2>/dev/null) && [ -n "$p" ] && kill -0 "$p" 2>/dev/null || kill -KILL "$MAINPID"'
SuccessExitStatus=SIGKILL
