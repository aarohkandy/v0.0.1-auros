# AurOS: no kernel messages on the screen she is looking at.
#
# Ubuntu's 10-console-messages.conf sets kernel.printk to 4 4 1 7: an error
# the kernel finds is printed over whatever is on the screen. On the first
# start that was "ntfs3: sda2: Primary boot signature is not NTFS" -- the
# kernel looking at Windows' own drives -- in the minute before AurOS's first
# screen (real Windows 11 run, 2026-11-04), and the staging screen asks for
# loglevel=3 for exactly this reason. Only a message that means the machine
# is going down (3 or less is "critical") stays on the screen; the rest is in
# the journal. tools/bootargstest.py checks it.
kernel.printk = 3 3 3 3
