# Where the desktop notes that she said "I called someone I know" before
# installing a remote-control program (src/aurshell/guard.c writes it as
# her; /usr/lib/auros/remote-access-gate reads it as polkitd and only
# believes a file owned by the person installing). Sticky, so nobody can
# remove or replace another person's answer. Gone at every restart.
d /run/auros-remote-access 1777 root root -
