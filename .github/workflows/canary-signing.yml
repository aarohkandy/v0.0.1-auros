# SEC-004's runtime proof, with a DECOY. It never touches the update-signing key: both
# jobs read APT_ENV_CANARY, a secret with a dummy value that the owner puts in the
# `apt-signing` environment, and only there (docs/OWNER-SETUP.md 4a-lock, step 4).
# Where the real key lives is proved from the API, by tools/sec004check.sh, run on
# the owner's Mac; no runner ever sees it.
#
# Started by hand. Nothing here takes an input.
#   On a THROWAWAY branch (the attack):
#     git push origin HEAD:refs/heads/canary-sec004
#     gh workflow run canary-signing.yml --ref canary-sec004
#     gh run watch        (then:  git push origin :canary-sec004 )
#   `outside` has no environment and must see nothing. `inside` is in apt-signing, whose
#   deployment-branch rule (main only) must REFUSE the branch before the job starts.
#   The verdict is green only on positive evidence: `outside` said "no", and `inside`
#   failed with its steps never run and GitHub's own words in the job's annotations
#   ("not allowed to deploy to apt-signing"). A cancelled, timed-out or otherwise failed
#   `inside` is not evidence: the verdict is red, and prints what it found.
#   On main (the control, once, after the owner's clicks):
#     gh workflow run canary-signing.yml
#   `inside` must start (after the reviewer's click) and see the decoy ("yes"); `outside`
#   still "no". That shows the decoy is really in the environment, so "no" outside means
#   something.
# Before the owner's clicks the attack run is red: the environment has no branch rule,
# so `inside` starts.
name: canary-signing

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  outside:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      visible: ${{ steps.c.outputs.visible }}
    steps:
      - id: c
        env:
          DECOY: ${{ secrets.APT_ENV_CANARY }}
        run: |
          if [ -n "$DECOY" ]; then v=yes; else v=no; fi
          echo "visible=$v" >> "$GITHUB_OUTPUT"
          echo "branch $GITHUB_REF_NAME: the decoy secret is visible to a job outside any environment: $v"

  inside:
    # The environment's deployment-branch rule decides whether this job starts.
    environment: apt-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      visible: ${{ steps.c.outputs.visible }}
    steps:
      - id: c
        env:
          DECOY: ${{ secrets.APT_ENV_CANARY }}
        run: |
          if [ -n "$DECOY" ]; then v=yes; else v=no; fi
          echo "visible=$v" >> "$GITHUB_OUTPUT"
          echo "branch $GITHUB_REF_NAME: the apt-signing environment let this job start; the decoy is visible in it: $v"

  verdict:
    needs: [outside, inside]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      OUTSIDE: ${{ needs.outside.outputs.visible }}
      INSIDE_RESULT: ${{ needs.inside.result }}
      INSIDE_VISIBLE: ${{ needs.inside.outputs.visible }}
      BRANCH: ${{ github.ref_name }}
      DEFAULT: ${{ github.event.repository.default_branch }}
    steps:
      - run: |
          bad=0
          [ "$OUTSIDE" = no ] || { echo "::error::outside said '$OUTSIDE', not 'no': the decoy is visible to a job outside the environment, or that job did not run"; bad=1; }
          if [ "$BRANCH" = "$DEFAULT" ]; then
            # The control: the environment holds the decoy and the job on main can read it.
            if [ "$INSIDE_RESULT" = success ] && [ "$INSIDE_VISIBLE" = yes ]; then
              echo "control ok: on $DEFAULT the apt-signing job started and sees the decoy, so 'no' outside means something"
            else
              echo "::error::control failed: inside was '$INSIDE_RESULT', decoy visible '$INSIDE_VISIBLE'; is APT_ENV_CANARY in the apt-signing environment?"; bad=1
            fi
          else
            # The attack: positive evidence of refusal, nothing less.
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "inside") | "\(.id)|\(.conclusion)|\([.steps[]? | select(.status == "completed" and .conclusion != "skipped")] | length)"') || jobs=""
            id=${jobs%%|*}; rest=${jobs#*|}; conc=${rest%%|*}; ran=${rest#*|}
            ann=""
            [ -n "$id" ] && ann=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations" --jq '.[].message' 2>/dev/null) || true
            echo "inside: result=$INSIDE_RESULT conclusion=${conc:-?} steps-run=${ran:-?}"
            echo "inside annotations: ${ann:-none}"
            if [ "$INSIDE_RESULT" = failure ] && [ "$conc" = failure ] && [ "${ran:-1}" = 0 ] && printf '%s' "$ann" | grep -qiE 'not allowed to deploy to .*apt-signing'; then
              echo "refusal confirmed: GitHub would not start a job from branch $BRANCH in apt-signing"
            else
              echo "::error::no positive evidence that apt-signing refused branch $BRANCH (cancelled, timed out, started, failed for another reason, or GitHub worded it differently: see the lines above)"; bad=1
            fi
          fi
          [ "$bad" = 0 ] && echo "CANARY OK"
          exit $bad
