# Everyday tasks, proven on the newest built image (stream PARITY,
# docs/handoff/streams/PARITY.md).
#
# What she does on Windows or a Mac every day, done on AurOS in a KVM VM that
# boots the image build.yml made: (a) a video call, (b) a film, (c) printing,
# (d) a .docx and .xlsx, (e) a PDF form, then (f) the top programs from
# "Get more programs". tools/parity/run.py drives it: it lays a test wrapper
# into the image (the shell is untouched), boots a qcow2 overlay under KVM,
# reads results from the serial port, and takes screenshots over QMP.
#
#   when   every night (03:17 UTC), when the head commit's SUBJECT says
#          [parity] (or [parity RUN-ID] for the image of that build run), or
#          by hand from the Actions tab. NEVER on a plain push: the gate job
#          below is the only thing a push starts, and it is seconds.
#   image  the newest build with an unexpired `auros-pieces` artifact; else the
#          newest v* prerelease's pieces.
#   queue  one at a time (concurrency on the everyday job, queued, never cancelled),
#          so this never takes more than one runner.
#   proof  tools/parity/known-gaps.txt lists checks that fail TODAY for a named
#          reason; one that fails is "GAP", one that starts passing fails the
#          job until it is removed from the list. Each check is shown red once
#          with --without (tools/parity/README.md).
#   result the table in the job summary, and every screenshot as an asset of the
#          prerelease parity-<run id> (only the newest six are kept):
#            https://github.com/<repo>/releases/download/parity-<run>/<name>.png
name: parity

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-id:
        description: build run whose image to test (empty = the newest build)
        required: false
        default: ''
      checks:
        description: comma list of desktop,call,film,print,office,pdfform and/or apps (default all)
        required: false
        default: ''
      apps:
        description: restrict the apps check to these Flathub ids or short names (comma list)
        required: false
        default: ''
      apt:
        description: Ubuntu packages to install into the VM first (shows a check green once the image carries them)
        required: false
        default: ''

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.g.outputs.go }}
      run-id: ${{ steps.g.outputs.run_id }}
      checks: ${{ steps.g.outputs.checks }}
      apps: ${{ steps.g.outputs.apps }}
      apt: ${{ steps.g.outputs.apt }}
    steps:
      - id: g
        env:
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
          IN_RUN: ${{ inputs.run-id }}
          IN_CHECKS: ${{ inputs.checks }}
          IN_APPS: ${{ inputs.apps }}
          IN_APT: ${{ inputs.apt }}
        run: |
          go=false; rid=""; checks=""; apps=""; apt=""
          case "$EVENT" in
            schedule) go=true ;;
            workflow_dispatch) go=true; rid=$IN_RUN; checks=$IN_CHECKS; apps=$IN_APPS; apt=$IN_APT ;;
            push)
              # In the subject line only, as in build.yml.
              subj=${MSG%%$'\n'*}
              case "$subj" in
                *'[parity'*)
                  go=true
                  inner=${subj#*\[parity}; inner=${inner%%\]*}
                  rid=$(printf '%s' "$inner" | tr -dc '0-9')
                  ;;
              esac ;;
          esac
          echo "go=$go" | tee -a "$GITHUB_OUTPUT"
          echo "run_id=$rid" | tee -a "$GITHUB_OUTPUT"
          echo "checks=$checks" | tee -a "$GITHUB_OUTPUT"
          echo "apps=$apps" | tee -a "$GITHUB_OUTPUT"
          echo "apt=$apt" | tee -a "$GITHUB_OUTPUT"

  everyday:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    # One at a time, queued, never cancelled. On the JOB, not the workflow: every push starts the gate,
    # and gates sharing the group would replace a queued real run (the first LibreOffice run was lost so).
    concurrency:
      group: parity
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: KVM and the tools
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sh tools/apt.sh qemu-system-x86 qemu-utils ovmf gdisk e2fsprogs util-linux python3 zstd
          [ -w /dev/kvm ] || { echo "no usable /dev/kvm"; exit 1; }
          dpkg -l ovmf qemu-system-x86 | tail -2
          sudo mkdir -p /mnt/parity && sudo chown "$USER" /mnt/parity
          df -h / /mnt
      - name: the newest image
        id: img
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ needs.gate.outputs.run-id }}
        run: |
          set -euo pipefail
          D=/mnt/parity/dl; mkdir -p "$D"
          if [ -z "$RID" ]; then
            RID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=auros-pieces&per_page=100" \
                  --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          fi
          if [ -n "$RID" ]; then
            gh run download "$RID" -R "$GITHUB_REPOSITORY" -n auros-pieces -D "$D"
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RID" --jq .head_sha)
            SRC="build run $RID, commit $SHA"
          else
            TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 40 --json tagName --jq '[.[] | select(.tagName | startswith("v"))] | first | .tagName // empty')
            [ -n "$TAG" ] || { echo "::error::no build artifact and no v* release to test"; exit 1; }
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'auros-desktop.img.gz.*' -p image.sha256 -D "$D"
            SRC="release $TAG"
          fi
          cat "$D"/auros-desktop.img.gz.* | gzip -dc | cp --sparse=always /dev/stdin /mnt/parity/auros-desktop.img
          echo "$(cat "$D/image.sha256")  /mnt/parity/auros-desktop.img" | sha256sum -c
          rm -rf "$D"
          echo "src=$SRC" | tee -a "$GITHUB_OUTPUT"
          echo "the image under test: $SRC" | tee -a "$GITHUB_STEP_SUMMARY"
          df -h /mnt
      - name: the checks, in VMs under KVM
        timeout-minutes: 150
        env:
          CHECKS: ${{ needs.gate.outputs.checks }}
          APPS: ${{ needs.gate.outputs.apps }}
          APT: ${{ needs.gate.outputs.apt }}
          SRC: ${{ steps.img.outputs.src }}
        run: |
          mkdir -p parity-out
          echo "$SRC" > parity-out/image.txt
          # phase 1: everything but the apps, one VM; phase 2: the apps, a VM of its own with a big disk
          EV=$(printf '%s' "$CHECKS" | tr ',' '\n' | grep -vx 'apps' | paste -sd, - || true)
          rc1=0; rc2=0
          if [ -z "$CHECKS" ] || [ -n "$EV" ]; then
            set +e
            sudo python3 tools/parity/run.py --image /mnt/parity/auros-desktop.img --out "$PWD/parity-out/everyday" \
                --work /mnt/parity/work --timeout 2700 ${EV:+--checks "$EV"} ${APT:+--apt "$APT"} 2>&1 | tee parity-out/everyday.log
            rc1=${PIPESTATUS[0]}
            set -e
          fi
          if [ -z "$CHECKS" ] || printf '%s' "$CHECKS" | tr ',' '\n' | grep -qx apps; then
            sudo rm -rf /mnt/parity/work
            set +e
            sudo python3 tools/parity/run.py --image /mnt/parity/auros-desktop.img --out "$PWD/parity-out/apps" \
                --work /mnt/parity/work --checks apps --disk-gb 28 --timeout 5700 ${APPS:+--apps "$APPS"} 2>&1 | tee parity-out/apps.log
            rc2=${PIPESTATUS[0]}
            set -e
          fi
          sudo chown -R "$USER" parity-out
          for d in everyday apps; do [ -f "parity-out/$d/results.md" ] && { echo "### $d"; cat "parity-out/$d/results.md"; } >> "$GITHUB_STEP_SUMMARY"; done
          echo "everyday rc=$rc1, apps rc=$rc2"
          [ "$rc1" -eq 0 ] && [ "$rc2" -eq 0 ]
      - name: evidence (a prerelease, the newest six kept)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: ${{ steps.img.outputs.src }}
        run: |
          [ -d parity-out ] || exit 0
          TAG="parity-$GITHUB_RUN_ID"
          { echo "Everyday tasks on the newest image ($SRC), run $GITHUB_RUN_ID."; for d in everyday apps; do echo; echo "### $d"; cat "parity-out/$d/results.md" 2>/dev/null || true; done; } > parity-out/notes.md
          mkdir -p parity-out/assets
          cp parity-out/image.txt parity-out/assets/ 2>/dev/null || true
          for d in everyday apps; do
            for f in results.md results.json serial.txt; do [ -f "parity-out/$d/$f" ] && cp "parity-out/$d/$f" "parity-out/assets/$d-$f"; done
            for f in parity-out/$d/screenshots/*.png; do [ -f "$f" ] && cp "$f" "parity-out/assets/$d-$(basename "$f")"; done
          done
          existing=(parity-out/assets/*)
          # At this commit if GitHub allows it, else at main: the token may not make a tag on a commit
          # that changes a workflow file (HTTP 403 "Resource not accessible by integration").
          mk() { gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --target "$1" \
                   --title "parity: everyday tasks, run $GITHUB_RUN_ID" --notes-file parity-out/notes.md; }
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || mk "$GITHUB_SHA" || mk main
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${existing[@]}"
          { echo; echo "Screenshots: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"; } >> "$GITHUB_STEP_SUMMARY"
          # only the newest six parity-* prereleases (our own evidence, not anybody's data)
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("parity-"))] | sort_by(.createdAt) | reverse | .[6:] | .[].tagName' |
            while read -r old; do gh release delete "$old" -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true; done
