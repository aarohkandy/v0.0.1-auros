# The legal checks (stream LEGAL): the source-release tool against a pretend
# Launchpad, and the consistency of the licence, terms and privacy texts
# (tools/legal/check.py). No network, no build, a minute. Runs only when a
# file it checks changes.
name: legal

on:
  push:
    branches: [main]
    paths:
      - 'build/sources'
      - 'tools/legal/**'
      - 'docs/legal/**'
      - 'docs/RELINK.md'
      - 'LICENSE'
      - 'README.md'
      - 'website/**'
      - 'rootfs/usr/share/doc/auros/**'
      - 'rootfs/usr/share/auros/help/**'
      - 'src/aurwl/gen/**'
      - 'src/aurbridge/wizard.c'
      - 'src/aurstage/install.c'
      - 'src/aurscreen/screen.c'
      - 'src/aurshell/welcome.c'
      - '.github/workflows/legal.yml'
      - '.github/workflows/sources.yml'
      - '.github/workflows/make-os.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  legal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: legal-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: build/sources against a pretend Launchpad, the publisher against a pretend GitHub, and their mutants
        run: |
          python3 -I tools/legal/sourcestest.py
          python3 -I tools/legal/sourcestest.py --mutants
          python3 -I tools/legal/publishtest.py
          python3 -I tools/legal/publishtest.py --mutants
          python3 -I tools/legal/stagingcheck.py selftest
      # sources.yml's and make-os.yml's own steps, run against a fake gh: which source release a
      # call may ask for, that the desktop's path is as it was, that a custom OS touches no AurOS
      # release, and that an installer is not published without its source.
      - name: the source offer of a custom OS (the workflows' own steps, run)
        run: |
          sh tools/apt.sh python3-yaml zstd
          python3 -I tools/legal/sourcesflowtest.py
      - name: the legal texts keep their promises
        run: |
          python3 -I tools/legal/check.py selftest
          python3 -I tools/legal/check.py
