# AurOS's own update channel: test it, and publish it.
# docs/security/UPDATES.md is the whole story; this is the machinery.
#
#   gate     decides. A push that touches the channel's files runs the
#            test. [apt] in the commit SUBJECT publishes the latest
#            (website) release; [apt TAG] publishes that release (an
#            urgent fix that is still a prerelease). A build or release
#            run that promoted a release ([latest] in its subject, and
#            green) publishes it by itself -- so a promoted fix reaches
#            every AurOS computer with nobody remembering to. Also
#            workflow_dispatch (tag optional).
#   test     tools/updatetest.sh in a fresh ubuntu:24.04 with a throwaway
#            key, then once with each protection removed: each of those
#            must FAIL, or the test is not testing anything.
#   publish  needs the test. Takes the .debs out of the RELEASED IMAGE
#            (what computers have is what the channel serves), refuses
#            anything older than what is published, signs with the secret
#            AUROS_APT_SIGNING_KEY only if that key is the committed
#            rootfs/usr/share/keyrings/auros-archive-keyring.asc, checks
#            the signature against the committed file, uploads to the
#            prerelease tag `apt` (never "latest"), reads every file back
#            through GitHub's redirect, and has a real apt on a fresh
#            Ubuntu see and fetch it.
#
# No committed key yet (the owner's step, docs/OWNER-SETUP.md 4a): the
# publish job prints the secret's public half and fingerprint in its
# summary (and as an artifact) and stops, publishing nothing.
name: aptrepo

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [build, release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to publish (empty: the latest release)"
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    # A workflow_run counts only after a green run that promoted a
    # release; decided here, without a runner, for all the others.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.head_commit.message, '[latest]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      test: ${{ steps.g.outputs.test }}
      publish: ${{ steps.g.outputs.publish }}
      tag: ${{ steps.g.outputs.tag }}
      boot: ${{ steps.g.outputs.boot }}
      bootrun: ${{ steps.g.outputs.bootrun }}
      ident: ${{ steps.g.outputs.ident }}
      identrun: ${{ steps.g.outputs.identrun }}
    steps:
      - id: g
        env:
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
          IN_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test=false; publish=false; tag=""; boot=false; bootrun=""; ident=false; identrun=""
          case "$EVENT" in
            workflow_run) test=true; publish=true ;;
            workflow_dispatch) test=true; publish=true; tag=$IN_TAG ;;
            push)
              SUBJ=${MSG%%$'\n'*}
              case "$SUBJ" in *'[apt]'*|*'[apt '*)
                test=true; publish=true
                tag=$(printf '%s' "$SUBJ" | sed -n 's/.*\[apt \([A-Za-z0-9._+-]*\)\].*/\1/p' | head -1) ;;
              esac
              case "$SUBJ" in *'[updateboot'*)
                boot=true
                bootrun=$(printf '%s' "$SUBJ" | sed -n 's/.*\[updateboot \([0-9][0-9]*\)\].*/\1/p' | head -1) ;;
              esac
              case "$SUBJ" in *'[identity'*)
                ident=true
                identrun=$(printf '%s' "$SUBJ" | sed -n 's/.*\[identity \([0-9][0-9]*\)\].*/\1/p' | head -1) ;;
              esac
              case "$BEFORE" in
                ''|0000000000000000000000000000000000000000)
                  files=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.files[].filename' || true) ;;
                *)
                  files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' || true) ;;
              esac
              if printf '%s\n' "$files" | grep -qE '^(build/aptchannel|tools/(update(policy)?|flatpakupdate)test\.sh|tools/repo\.sh|rootfs/etc/apt/|rootfs/etc/systemd/system/auros-flatpak-update|rootfs/usr/lib/auros/(hold-running-apps|keep-previous|rollback|shell-guard)|\.github/workflows/aptrepo\.yml$)'; then
                test=true
              fi ;;
          esac
          { echo "test=$test"; echo "publish=$publish"; echo "tag=$tag"; echo "boot=$boot"; echo "bootrun=$bootrun"; echo "ident=$ident"; echo "identrun=$identrun"; } | tee -a "$GITHUB_OUTPUT"

  test:
    needs: gate
    if: needs.gate.outputs.test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: the address is derived, never typed
        run: |
          want="https://github.com/$GITHUB_REPOSITORY/releases/download/apt/"
          got=$(build/aptchannel url); [ "$got" = "$want" ] || { echo "from GITHUB_REPOSITORY: $got, wanted $want"; exit 1; }
          got=$(env -u GITHUB_REPOSITORY build/aptchannel url); [ "$got" = "$want" ] || { echo "from the origin remote: $got, wanted $want"; exit 1; }
          echo "$want"
      - name: a fresh ubuntu:24.04, a throwaway key, and each protection removed
        run: |
          run() {
            docker run --rm -v "$PWD":/w:ro -w /w ubuntu:24.04 bash -c '
              for i in 1 2 3; do
                timeout 300 apt-get update -q && timeout 300 env DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
                  --no-install-recommends unattended-upgrades gnupg gpgv python3 hello xz-utils && break
                sleep 10
              done > /tmp/deps.log 2>&1 || { tail -30 /tmp/deps.log; exit 3; }
              bash tools/updatetest.sh "$@"' _ "$@"
          }
          run | tee updatetest.log
          for b in trusted signedby pin origin keep; do
            set +e; run --break=$b > break.log 2>&1; rc=$?; set -e
            grep -E 'FAIL$|^updatetest' break.log | sed "s/^/[--break=$b] /"
            [ "$rc" = 1 ] || { cat break.log; echo "::error::with --break=$b the test exited $rc, not 1: it did not catch a removed protection"; exit 1; }
          done
          { echo '### updatetest'; echo '```'; grep -E ' ok$| FAIL$|^updatetest|^==' updatetest.log; echo '```'
            echo 'Each of --break=trusted, signedby, pin, origin, keep made it fail, as it must.'; } >> "$GITHUB_STEP_SUMMARY"
      - name: her Flathub programs update by themselves (the unit's own commands, a local stand-in for Flathub)
        run: |
          fp() {
            docker run --rm --privileged -v "$PWD":/w:ro -w /w ubuntu:24.04 bash -c '
              for i in 1 2 3; do
                timeout 300 apt-get update -q && timeout 300 env DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
                  --no-install-recommends flatpak ostree ca-certificates && break
                sleep 10
              done > /tmp/deps.log 2>&1 || { tail -30 /tmp/deps.log; exit 3; }
              bash tools/flatpakupdatetest.sh "$@"' _ "$@"
          }
          fp | tee flatpak.log
          set +e; fp --break=unit > break.log 2>&1; rc=$?; set -e
          grep -E 'FAIL$|^flatpakupdatetest' break.log | sed 's/^/[--break=unit] /'
          [ "$rc" = 1 ] || { cat break.log; echo "::error::with the update line broken the test exited $rc, not 1"; exit 1; }
          { echo '### flatpakupdatetest'; echo '```'; grep -E ' ok$| FAIL$|^flatpakupdatetest' flatpak.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Firefox updates by itself, never while it is open (packages.mozilla.org, real unattended-upgrade)
        run: |
          ff() {
            docker run --rm -v "$PWD":/w:ro -w /w ubuntu:24.04 bash -c '
              for i in 1 2 3; do
                timeout 300 apt-get update -q && timeout 300 env DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
                  --no-install-recommends unattended-upgrades gnupg curl ca-certificates procps && break
                sleep 10
              done > /tmp/deps.log 2>&1 || { tail -30 /tmp/deps.log; exit 3; }
              bash tools/updatepolicytest.sh firefox "$@"' _ "$@"
          }
          ff | tee firefox.log
          set +e; ff --break=origin > break.log 2>&1; rc=$?; set -e
          grep -E 'FAIL$|^updatepolicytest' break.log | sed 's/^/[--break=origin] /'
          [ "$rc" = 1 ] || { cat break.log; echo "::error::without the Mozilla origin the test exited $rc, not 1"; exit 1; }
          { echo '### Firefox'; echo '```'; grep -E ' ok$| FAIL$|^updatepolicytest' firefox.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [gate, test]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: aptrepo-publish
      cancel-in-progress: false
    # SEC-004: the update-signing key is root on every AurOS computer, so
    # the only job that names it runs in an environment the owner locks to
    # `main` with himself as the required reviewer, and holds the secret
    # there rather than for the whole repository (docs/OWNER-SETUP.md
    # section 4a; tools/workflowlint.py fails a job that names the key
    # without this line). Until the owner creates those rules the
    # environment is created empty by GitHub on first use and the
    # repository-level secret still reaches it; nothing breaks.
    environment: apt-signing
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      IN_TAG: ${{ needs.gate.outputs.tag }}
      KR: rootfs/usr/share/keyrings/auros-archive-keyring.asc
      # The owned address (docs/ops/DOMAIN.md); empty = GitHub's.
      AUROS_DOMAIN: ${{ vars.AUROS_DOMAIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: the signing key is the one AurOS computers trust
        env:
          SIGNING_KEY: ${{ secrets.AUROS_APT_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::No update-signing key yet. The owner adds the secret AUROS_APT_SIGNING_KEY once (docs/OWNER-SETUP.md 4a). Nothing was published."
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 "$GNUPGHOME"; echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --quiet --import
          # Every secret key in the secret (two during a rotation).
          fprs=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{s=1; next} s && /^fpr:/{print $10; s=0}')
          [ -n "$fprs" ] || { echo "::error::the secret AUROS_APT_SIGNING_KEY holds no OpenPGP private key"; exit 1; }
          if [ ! -s "$KR" ]; then
            gpg --armor --export $fprs > auros-archive-keyring.asc
            { echo "### The update key's public half, to commit"
              echo "Fingerprint(s): \`$(echo $fprs)\`"
              echo
              echo "Check it is the fingerprint the owner wrote down, then commit this file as \`$KR\` (also this run's artifact \`auros-archive-keyring\`):"
              echo '```'; cat auros-archive-keyring.asc; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$KR is not committed yet: nothing was published. The key's public half (fingerprint $(echo $fprs)) is in this run's summary and artifact. Commit it, then [release], [latest], and the channel publishes."
            exit 1
          fi
          pub=$(gpg --batch --with-colons --import-options show-only --import "$KR" 2>/dev/null | awk -F: '/^fpr:/{print $10}')
          for f in $fprs; do
            printf '%s\n' "$pub" | grep -qx "$f" || { echo "::error::the secret's key $f is not in the committed $KR. Refusing to sign with a key no AurOS computer trusts."; exit 1; }
            exp=$(gpg --list-keys --with-colons "$f" | awk -F: '/^pub:/{print $7; exit}')
            if [ -n "$exp" ]; then
              days=$(( (exp - $(date +%s)) / 86400 ))
              echo "key $f expires in $days days"
              [ "$days" -ge 180 ] || echo "::warning::the update key $f expires in $days days: rotate it now (docs/security/UPDATES.md, 'Key rotation')"
            fi
          done
          echo "FPRS=$(echo $fprs)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && hashFiles('auros-archive-keyring.asc') != ''
        with:
          name: auros-archive-keyring
          path: auros-archive-keyring.asc

      - name: which release
        run: |
          tag=$IN_TAG
          case "$tag" in *[!A-Za-z0-9._+-]*) echo "::error::'$tag' is not a release tag"; exit 1 ;; esac
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null) ||
              { echo "::error::no release is the latest yet; name one with [apt TAG]"; exit 1; }
          fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json tagName,isPrerelease --jq '"\(.tagName) prerelease=\(.isPrerelease)"' ||
            { echo "::error::no release $tag"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: its packages, taken out of the released image itself
        run: |
          mkdir -p rel
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D rel -p pieces.txt -p 'auros-desktop.img.gz.*'
          ( cd rel && grep '^piece ' pieces.txt | awk '{print $4"  "$2}' | sha256sum -c --quiet )
          cat rel/auros-desktop.img.gz.* | gzip -dc > "$RUNNER_TEMP/img"
          rm -rf rel
          start=$(sfdisk -J "$RUNNER_TEMP/img" | python3 -c 'import json,sys; p=json.load(sys.stdin)["partitiontable"]["partitions"]; print(p[1]["start"])')
          fs="$RUNNER_TEMP/img?offset=$((start * 512))"
          debugfs -R "rdump /var/lib/auros/debs $PWD" "$fs" 2>/dev/null
          debugfs -R "dump /etc/apt/sources.list.d/auros.sources $PWD/image.sources" "$fs" 2>/dev/null
          debugfs -R "dump /usr/share/keyrings/auros-archive-keyring.asc $PWD/image-key.asc" "$fs" 2>/dev/null
          rm -f "$RUNNER_TEMP/img"
          [ -s debs/SHA256SUMS ] || { echo "::error::$TAG's image has no /var/lib/auros/debs: it was built before the update channel existed"; exit 1; }
          ( cd debs && sha256sum -c --quiet SHA256SUMS )
          # What this image's computers trust and ask must be this key
          # and this address, or publishing it here reaches nobody.
          [ -s image-key.asc ] && cmp -s image-key.asc "$KR" ||
            { echo "::error::$TAG's image does not carry the committed key $KR (built before the key was committed?)"; exit 1; }
          want=$(build/aptchannel url)
          # An image built before AUROS_DOMAIN asks GitHub directly: the same tag.
          grep -qx -e "URIs: $want" -e "URIs: $(env -u AUROS_DOMAIN build/aptchannel url)" image.sources ||
            { echo "::error::$TAG's image asks $(sed -n 's/^URIs: //p' image.sources) for updates, not $want"; exit 1; }
          ls -la debs

      - name: newer than what is published
        id: newer
        run: |
          new=$(dpkg-deb -f debs/auros_*_amd64.deb Version)
          echo "NEW=$new" >> "$GITHUB_ENV"
          go=true
          if curl -fsSL --retry 3 -o published.Packages "$(build/aptchannel url)Packages" 2>/dev/null; then
            old=$(awk '/^Package: auros$/{p=1} p && /^Version:/{print $2; exit}' published.Packages)
            echo "published: auros $old; this release: auros $new"
            if [ -n "$old" ] && dpkg --compare-versions "$new" lt "$old"; then
              echo "::error::$TAG (auros $new) is older than what the channel already serves ($old). Computers never go back; nothing was published."
              exit 1
            fi
            if [ "$new" = "$old" ]; then go=false; echo "auros $new is already what the channel serves: nothing to do"; fi
          else
            echo "nothing published yet"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - name: the repository, signed, checked against the committed key
        if: steps.newer.outputs.go == 'true'
        run: |
          build/aptchannel repo debs repo
          build/aptchannel sign repo $FPRS
          build/aptchannel verify repo "$KR"

      - name: publish (packages first, the signed index last)
        if: steps.newer.outputs.go == 'true'
        run: |
          R=$GITHUB_REPOSITORY
          if ! gh release view apt -R "$R" >/dev/null 2>&1; then
            printf '%s\n' "This is not an installer. It is the signed apt repository AurOS computers update their own parts from, by themselves (docs/security/UPDATES.md). To install AurOS, use the latest release." > apt-notes.md
            gh release create apt -R "$R" --prerelease --latest=false --target "$GITHUB_SHA" \
                --title "AurOS updates (apt repository)" --notes-file apt-notes.md
          fi
          # A computer that read the old index a moment ago still finds
          # what it names until the end; one that reads the new index
          # finds its packages already there.
          gh release upload apt -R "$R" --clobber repo/*.deb
          gh release upload apt -R "$R" --clobber repo/Packages repo/Packages.gz
          gh release upload apt -R "$R" --clobber repo/Release repo/Release.gpg
          gh release upload apt -R "$R" --clobber repo/InRelease
          ( cd repo && ls ) > keep.txt
          gh release view apt -R "$R" --json assets --jq '.assets[].name' | while read -r a; do
            grep -qxF "$a" keep.txt || { gh release delete-asset apt "$a" -R "$R" -y; echo "removed $a"; }
          done

      # Always, even when this version is already what the channel serves
      # (nothing was uploaded): `[apt]` is then a health check of what
      # computers will find. GitHub's download address can answer 404 for
      # a few seconds after the release is created, and curl does not
      # retry a 404 unless told to.
      - name: read back through GitHub's redirect, and checked again
        run: |
          base=$(build/aptchannel url)
          mkdir -p back
          get() { curl -fsSL --retry 10 --retry-delay 6 --retry-all-errors -o "back/$1" "$base$1"; }
          for f in InRelease Release Release.gpg Packages Packages.gz; do get "$f"; done
          for f in $(sed -n 's#^Filename: \./##p' back/Packages); do get "$f"; done
          if [ -d repo ]; then for f in $(cat keep.txt); do cmp "back/$f" "repo/$f"; done; fi
          build/aptchannel verify back "$KR"
          got=$(awk '/^Package: auros$/{p=1} p && /^Version:/{print $2; exit}' back/Packages)
          [ "$got" = "$NEW" ] || { echo "::error::the channel serves auros $got, not $NEW"; exit 1; }
          echo "the channel serves auros $got, signed by the committed key"

      - name: a real apt on a fresh Ubuntu sees it and fetches it
        run: |
          docker run --rm -v "$PWD":/w:ro -w /w -e URL="$(build/aptchannel url)" -e NEW="$NEW" ubuntu:24.04 bash -c '
            set -e
            for i in 1 2 3; do timeout 300 apt-get update -q && timeout 300 apt-get install -y -q ca-certificates && break; sleep 10; done > /tmp/deps.log 2>&1
            cp rootfs/usr/share/keyrings/auros-archive-keyring.asc /usr/share/keyrings/
            cp rootfs/etc/apt/preferences.d/auros /etc/apt/preferences.d/
            bash build/aptchannel source "$URL" > /etc/apt/sources.list.d/auros.sources
            timeout 300 apt-get update 2>&1 | tee /tmp/u.log
            if grep -E "^(W|E):" /tmp/u.log | grep -qF "$URL"; then exit 1; fi
            apt-cache policy auros | tee /tmp/p.log
            grep -q "Candidate: $NEW" /tmp/p.log
            cd /tmp && apt-get download $(apt-cache pkgnames auros)
            ls -la /tmp/*.deb'
          { echo "### AurOS updates: auros $NEW from $TAG"
            echo "Published at $(build/aptchannel url), signed by \`$FPRS\`; read back and fetched by a real apt."; } >> "$GITHUB_STEP_SUMMARY"

  # [updateboot] / [updateboot RUN-ID] in the subject: tools/updateboottest.sh
  # under KVM on a built image (that run's, else the newest build run whose
  # build job passed). Its own job, outside tests.yml, until it has been
  # green: release.yml publishes only builds whose every test passed.
  boot:
    needs: gate
    if: needs.gate.outputs.boot == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      IN_RUN: ${{ needs.gate.outputs.bootrun }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: which build
        id: run
        run: |
          rid=$IN_RUN
          if [ -z "$rid" ]; then
            for r in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&per_page=30" --jq '.workflow_runs[].id'); do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$r/jobs?per_page=100" --jq '.jobs[] | select(.name == "build") | .conclusion' | grep -qx success; then
                rid=$r; break
              fi
            done
          fi
          [ -n "$rid" ] || { echo "::error::no build run with a built image"; exit 1; }
          echo "build run $rid: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$rid"
          echo "rid=$rid" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: auros-pieces
          path: dl/pieces
          run-id: ${{ steps.run.outputs.rid }}
          github-token: ${{ github.token }}
      - name: KVM, QEMU, OVMF, and the image
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sh tools/apt.sh qemu-system-x86 qemu-utils ovmf gdisk e2fsprogs python3
          [ -w /dev/kvm ] || { echo "no usable /dev/kvm"; exit 1; }
          mkdir -p out
          ( cd dl/pieces && sha256sum -c --quiet <(grep '^piece ' pieces.txt | awk '{print $4"  "$2}') )
          cat dl/pieces/auros-desktop.img.gz.* | gzip -dc | cp --sparse=always /dev/stdin out/auros-desktop.img
          echo "$(cat dl/pieces/image.sha256)  out/auros-desktop.img" | sha256sum -c
          rm -rf dl
      - name: updateboottest under KVM
        run: |
          sudo env PATH="$PATH" sh tools/updateboottest.sh 2>&1 | tee updateboottest.txt
          { echo '### updateboottest'; echo '```'; grep -E ' ok$| FAIL$|^updateboottest|^  boot' updateboottest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: updateboottest
          path: updateboottest.txt

  # [identity] / [identity RUN-ID] in the subject: would the BUILT image's own
  # unattended-upgrade install an Ubuntu security update? (TM-1: AurOS
  # rewrites os-release; ${distro_id}/${distro_codename} come from lsb_release.)
  # Runs tools/updatepolicytest.sh dryrun on that build's rootfs artifact, as
  # built and with this repository's 53auros-updates laid over it.
  identity:
    needs: gate
    if: needs.gate.outputs.ident == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      IN_RUN: ${{ needs.gate.outputs.identrun }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: which build
        id: run
        run: |
          rid=$IN_RUN
          if [ -z "$rid" ]; then
            for r in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&per_page=30" --jq '.workflow_runs[].id'); do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$r/jobs?per_page=100" --jq '.jobs[] | select(.name == "build") | .conclusion' | grep -qx success; then
                rid=$r; break
              fi
            done
          fi
          [ -n "$rid" ] || { echo "::error::no build run with a rootfs"; exit 1; }
          echo "build run $rid: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$rid"
          echo "rid=$rid" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: auros-rootfs
          path: dl
          run-id: ${{ steps.run.outputs.rid }}
          github-token: ${{ github.token }}
      - name: the built rootfs
        run: |
          sudo mkdir -p work
          zstd -dc dl/rootfs.tar.zst | sudo tar -C work --numeric-owner -xf -
          rm -rf dl
          sudo test -f work/rootfs/etc/os-release
      - name: as built
        id: asbuilt
        continue-on-error: true
        run: sudo bash tools/updatepolicytest.sh dryrun work/rootfs 2>&1 | tee asbuilt.txt
      - name: with this repository's 53auros-updates laid over it
        id: fixed
        continue-on-error: true
        run: sudo bash tools/updatepolicytest.sh dryrun work/rootfs --repo-config 2>&1 | tee fixed.txt
      - name: who else reads the image's name, in the built image
        run: |
          # Every file that asks the system what it is: lsb_release, os-release,
          # the two update variables. Each is a reader that now sees AurOS/Nocturne.
          # (Written outside work/rootfs: that tree belongs to root.)
          R=$PWD/work/rootfs; O=$RUNNER_TEMP/readers; mkdir -p "$O"
          ( cd "$R" && sudo grep -rIlE 'lsb_release|distro_codename|distro_id|VERSION_CODENAME|os-release' \
              etc usr/bin usr/sbin usr/lib/apt usr/lib/python3 usr/share/unattended-upgrades usr/lib/auros usr/lib/systemd lib 2>/dev/null ) |
            { grep -vE '/__pycache__/|\.pyc$|/usr/share/doc/|\.md5sums$' || true; } | sort > "$O/readers.txt"
          echo "readers: $(wc -l < "$O/readers.txt") files"
          # With the package that owns each, from the image's own dpkg.
          while read -r f; do
            # (|| true: a file no package owns makes dpkg -S fail, and pipefail would end the loop)
            o=$(sudo chroot "$R" dpkg -S "/$f" 2>/dev/null | head -1 | cut -d: -f1 || true)
            printf '%-72s %s\n' "$f" "${o:-(not a package)}"
          done < "$O/readers.txt" > "$O/owned.txt"
          head -400 "$O/owned.txt"
          { echo '### files that read the identity (file, owning package)'; echo '```'; head -400 "$O/owned.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: what else in the built image talks to Canonical (Ubuntu Pro, ESM, news, reports)
        run: |
          set +e +o pipefail   # an empty grep is an answer here, not an error
          R=$PWD/work/rootfs
          {
            echo "--- packages that talk to Canonical, installed?"
            sudo chroot "$R" dpkg-query -W -f='${Package} ${Version} ${Status}\n' ubuntu-pro-client ubuntu-advantage-tools update-notifier-common apport whoopsie popularity-contest ubuntu-report motd-news-config landscape-common snapd 2>&1 | sed 's/^/  /'
            echo "--- apt hooks"
            sudo grep -ls -iE 'esm|ubuntu-advantage|ubuntu-pro|apt-news|motd|update-notifier' "$R"/etc/apt/apt.conf.d/* | sed 's#.*/etc/#  etc/#'
            echo "--- apt sources / preferences"
            sudo ls "$R"/etc/apt/sources.list.d "$R"/etc/apt/preferences.d | sed 's/^/  /'
            echo "--- enabled units (symlinks under etc/systemd/system)"
            sudo find "$R"/etc/systemd/system -type l 2>/dev/null | grep -iE 'apt-news|esm|ua-timer|ubuntu-advantage|motd|whoopsie|popcon|apport|ubuntu-report|update-notifier|ua-reboot|landscape' | sed "s#$R/##; s/^/  /"
            echo "--- timers shipped by ubuntu-pro-client"
            sudo ls "$R"/usr/lib/systemd/system 2>/dev/null | grep -iE 'ua-|apt-news|esm|ubuntu-advantage' | sed 's/^/  /'
          } 2>&1 | tee canonical.txt
          { echo '### what else talks to Canonical'; echo '```'; cat canonical.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: nothing phones Canonical, as built
        id: canon_built
        continue-on-error: true
        run: sudo bash tools/updatepolicytest.sh canonical work/rootfs 2>&1 | tee canon-built.txt
      - name: nothing phones Canonical, with this repository's rootfs/ laid over the image (as build/forge does)
        id: canon_fixed
        continue-on-error: true
        run: sudo bash tools/updatepolicytest.sh canonical work/rootfs --repo-overlay 2>&1 | tee canon-fixed.txt
      - name: summary
        run: |
          { echo '### canonical, as built'; echo '```'; cat canon-built.txt; echo '```'
            echo '### canonical, with the repository rootfs/ laid over it'; echo '```'; cat canon-fixed.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "canonical as built: ${{ steps.canon_built.outcome }}; with the repository rootfs/: ${{ steps.canon_fixed.outcome }}"
          [ "${{ steps.canon_fixed.outcome }}" = success ]
      - name: summary (update origins)
        run: |
          { echo '### as built'; echo '```'; cat asbuilt.txt; echo '```'
            echo '### with the repository config laid over it'; echo '```'; cat fixed.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "as built: ${{ steps.asbuilt.outcome }}; with the repository config: ${{ steps.fixed.outcome }}"
          [ "${{ steps.fixed.outcome }}" = success ]
