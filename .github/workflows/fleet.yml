# fleet.csv (WP-35, stream OPS): one row a day of how many people took AurOS: GitHub's own counter on the
# installer of every full release, and, once the domain's gate exists, yesterday's count and the wave.
# Kept as an asset of the prerelease tag `fleet` (never "latest"), so nothing is committed.
# Read it:  gh release download fleet -p fleet.csv -R <repo> -O - | column -s, -t
name: fleet

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/ops/fleet.py']

permissions:
  contents: write

concurrency:
  group: fleet
  cancel-in-progress: false

jobs:
  fleet:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      AUROS_DOMAIN: ${{ vars.AUROS_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ops
      - run: python3 -I tools/ops/fleet.py --selftest
      - name: add today's row
        run: |
          gh release view fleet >/dev/null 2>&1 || gh release create fleet --prerelease --title "AurOS fleet counts (data, not a release)" \
            --notes "fleet.csv: one row a day (tools/ops/fleet.py). Not an AurOS release."
          rm -f old.csv; gh release download fleet -p fleet.csv -O old.csv 2>/dev/null || true
          python3 -I tools/ops/fleet.py old.csv > fleet.csv
          cat fleet.csv
          gh release upload fleet fleet.csv --clobber
          { echo '### fleet.csv'; echo '```'; tail -8 fleet.csv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
