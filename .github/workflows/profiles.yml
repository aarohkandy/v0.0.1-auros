# Every version of AurOS builds, and starts up to its own desktop.
#
# build.yml builds and tests one profile, desktop. The other four --
# office, revive, school-kiosk, multilingual -- had not been built by
# anything automatic, and two of them had stopped building without
# anybody noticing (docs/handoff/streams/P.md). This builds each one the
# way build.yml builds desktop (build/all, no browser fallback, on a
# network that reaches Mozilla), then boots it under KVM with
# tools/profiletest.sh and photographs its desktop.
#
#   gate     runs it when the commit SUBJECT says [profiles] (all four)
#            or e.g. [profiles office revive] (just those), or when the
#            push changed profiles/, tools/profiletest* or this file. A
#            change to one of the four profile files builds only that
#            one; desktop.profile, which they all inherit, builds all.
#            [profiles:diagnostic] suppresses image builds only for a
#            strict test/docs allowlist, so retained images can be reused.
#            [ibus-functional] is retained as the public trigger name for
#            compatibility. It adds multilingual and makes only that fresh
#            image run the shipped-Fcitx Mousepad and Firefox Pinyin proof.
#   lint     seconds: tools/profiletest.sh selftest (every check fails
#            on broken input) and lint (every package exists, no snap
#            stubs, no unknown excludes) -- before an hour of builds.
#   evidence makes and verifies the one prerelease shared by this run.
#   profile  one job per profile, TWO AT A TIME (max-parallel: 2; the
#            free plan has 20 job slots shared by every workflow here).
#            Evidence goes to prerelease profiles-<run id>:
#              https://github.com/<repo>/releases/download/profiles-<run>/<profile>.png
#            and <profile>-report.txt, -image.txt, -serial.txt,
#            -build.log.gz. (Actions artifacts cannot be fetched from
#            the development container; release assets can.)
#   summary  the table of sizes and results in the release notes, and
#            only the newest four profiles-* prereleases kept.
name: profiles

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retained_multilingual_run_id:
        description: Exact completed main profiles run whose retained multilingual image to diagnose
        required: true
        type: string
      x11_panel_probe:
        description: Also observe the X11 panel during this retained multilingual diagnostic
        required: false
        default: false
        type: boolean
      fcitx_client_probe:
        description: Exercise FCITX clients in this retained multilingual diagnostic
        required: false
        default: false
        type: boolean
      fcitx_security_probe:
        description: Add two-round focus and sensitive-field checks to the FCITX diagnostic
        required: false
        default: false
        type: boolean
      fcitx_production_security_probe:
        description: Certify shipped FCITX focus, password and reboot behavior on a retained fresh image
        required: false
        default: false
        type: boolean

# contents: write is for the jobs that make or fill a release, and only
# those (SEC-005): a job that runs a lot of code cannot replace what a
# person downloads.
permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

# NO workflow-level concurrency, for build.yml's reason: every push runs
# the gate, and GitHub keeps one pending run per group, so a docs-only
# push would replace a queued real build. The group is on the profile
# job, per profile: a newer run's office replaces an older run's
# waiting office, and nothing else.

jobs:
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.g.outputs.go }}
      list: ${{ steps.g.outputs.list }}
      ibus_functional: ${{ steps.g.outputs.ibus_functional }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: profile gate rejects unsafe suppression
        run: python3 tools/profiletest-gate.py selftest
      - name: FCITX trace parser rejects malformed evidence
        run: |
          python3 -m unittest -v tools/test_profiletest_revive.py tools/test_fcitx_wayland_trace.py \
            tools/test_fcitx_connection_probe.py tools/test_fcitx_password_server.py \
            tools/test_fcitx_trace_writers.py tools/test_fcitx_profile_snapshot.py \
            tools/test_fcitx_marker_visibility.py
      - id: g
        env:
          MSG: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SUBJ=${MSG%%$'\n'*}
          case "$BEFORE" in
            ''|0000000000000000000000000000000000000000)
              gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA?per_page=100" > /tmp/changed-pages.json \
                || { echo "::error::GitHub did not list the files this push changed: failing closed (a gate must not skip on an API error)"; exit 1; } ;;
            *)
              gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA?per_page=100" > /tmp/changed-pages.json \
                || { echo "::error::GitHub did not list the files this push changed: failing closed (a gate must not skip on an API error)"; exit 1; } ;;
          esac
          python3 tools/profiletest-gate.py decide --subject "$SUBJ" \
            --github-pages /tmp/changed-pages.json --github-output "$GITHUB_OUTPUT"

  lint:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: every check refuses what it exists to refuse
        run: sh tools/profiletest.sh selftest
      - name: retained image evidence rejects substitutions
        run: python3 -m unittest -v tools/test_profile_image.py
      - name: every profile asks only for what its suite has
        run: sh tools/profiletest.sh lint office revive school-kiosk multilingual desktop
      - name: one verified evidence release feeds at most two build lanes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/profiles.yml").read_text(encoding="utf-8")
          evidence = text.split("\n  evidence:\n", 1)[1].split("\n  profile:\n", 1)[0]
          profile = text.split("\n  profile:\n", 1)[1].split("\n  ibus-retest:\n", 1)[0]
          retest = text.split("\n  ibus-retest:\n", 1)[1].split("\n  summary:\n", 1)[0]
          prune = text.split("\n  prune:\n", 1)[1]
          checks = {
              "exactly one normal job creates the evidence release":
                  evidence.count("gh release " + "create") == 1,
              "the setup job verifies its release":
                  'gh release view "$TAG"' in evidence,
              "profiles wait for the verified release":
                  "needs: [gate, lint, evidence]" in profile,
              "the matrix uses the repository-wide two-lane limit":
                  "max-parallel: 2" in profile,
              "the immutable anchor precedes mutable publication":
                  profile.index("name: profile-$" + "{{ matrix.profile }}") <
                  profile.index("- name: publish the evidence"),
              "retained pieces publish before their eligibility manifest":
                  profile.index('gh release upload "$TAG" "${pieces[@]}"') <
                  profile.index('gh release upload "$TAG" ev/multilingual-image-v1.json'),
              "the isolated diagnostic creates and verifies its own release":
                  retest.count("gh release " + "create") == 1 and
                  'gh release view "$TAG"' in retest,
              "build, diagnostic, and pruning share the multilingual lock":
                  ("group: profiles-$" + "{{ github.ref }}-$" + "{{ matrix.profile }}") in profile and
                  ("group: profiles-$" + "{{ github.ref }}-multilingual") in retest and
                  ("group: profiles-$" + "{{ github.ref }}-multilingual") in prune,
              "the X11 probe exists only in the retained diagnostic":
                  "PROFILETEST_IBUS_X11_PROBE" not in profile and
                  retest.count("PROFILETEST_IBUS_X11_PROBE") == 1,
              "the FCITX probe exists only in the retained diagnostic":
                  "PROFILETEST_FCITX_CLIENT_PROBE" not in profile and
                  retest.count("PROFILETEST_FCITX_CLIENT_PROBE") == 1,
              "the FCITX security stage exists only in the retained diagnostic":
                  "PROFILETEST_FCITX_SECURITY_PROBE" not in profile and
                  retest.count("PROFILETEST_FCITX_SECURITY_PROBE") == 1,
              "fresh functional certification uses only shipped Fcitx":
                  profile.count("PROFILETEST_FCITX_PRODUCTION") == 1 and
                  "PROFILETEST_IBUS_FUNCTIONAL" not in profile and
                  retest.count("PROFILETEST_FCITX_PRODUCTION") == 1,
              "production security is explicit and recorded":
                  "--production-security '${" + "{ inputs.fcitx_production_security_probe }}'" in retest and
                  'value["fcitx_production_security_probe"]' in retest and
                  'PROFILETEST_FCITX_PRODUCTION="${' + '{ steps.mode.outputs.production }}"' in retest,
              "diagnostic probe options are validated together":
                  "profiletest-gate.py probe-mode" in retest,
          }
          failed = [message for message, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("profile workflow: " + "; ".join(failed))
          print("profile workflow: one verified release, at most two build lanes")
          PY

  evidence:
    needs: [gate, lint]
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 5
    env:
      TAG: profiles-${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: make and verify this run's evidence release
        run: |
          # At this commit if GitHub allows it, else at main: the token
          # may not make a tag on a commit that changes a workflow file
          # (HTTP 403 "Resource not accessible by integration"; run
          # 39902765034). The files are this run's either way.
          mk() { gh release create "$TAG" --prerelease --target "$1" \
                   --title "profiles: every version builds and boots, run $GITHUB_RUN_ID" \
                   --notes "Running: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; }
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if ! mk "$GITHUB_SHA"; then
              if ! gh release view "$TAG" >/dev/null 2>&1; then
                mk main || { echo "::error::could not create evidence release $TAG at $GITHUB_SHA or main"; exit 1; }
              fi
            fi
          fi
          gh release view "$TAG" >/dev/null 2>&1 || {
            echo "::error::evidence release $TAG does not exist after creation"
            exit 1
          }

  profile:
    needs: [gate, lint, evidence]
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    timeout-minutes: 150
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.gate.outputs.list) }}
    concurrency:
      group: profiles-${{ github.ref }}-${{ matrix.profile }}
      cancel-in-progress: false
    name: ${{ matrix.profile }}
    env:
      P: ${{ matrix.profile }}
      TAG: profiles-${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: room, tools, KVM
        run: |
          mkdir -p ev
          ( sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
              /usr/local/share/chromium /usr/local/julia* 2>/dev/null; echo removed > /tmp/freed ) &
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Bounded: a hung mirror must cost five minutes, not the job's 150.
          for i in 1 2 3; do
            sudo timeout 300 apt-get update -q &&
            sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y -q --no-install-recommends \
                debootstrap squashfs-tools zstd gdisk dosfstools mtools e2fsprogs \
                sbsigntool gcc libc6-dev make python3 cpio file binutils pigz \
                qemu-system-x86 qemu-utils ovmf tesseract-ocr && break
            [ "$i" = 3 ] && exit 1; sleep 15
          done
          while [ ! -f /tmp/freed ]; do sleep 2; done
          ls -l /dev/kvm; df -h /

      # build.yml's cache, by build.yml's exact key: debootstrap reads
      # only the release pocket, so the base is the same bytes for every
      # profile that keeps desktop's base_* lines (all four do; lint
      # would not care, so it is asked here).
      - name: cache key for the debootstrapped base
        id: basekey
        run: |
          if grep -qE '^base_(suite|mirror|components)=' "profiles/$P.profile"; then
            echo "key=none-$P-has-its-own-base" | tee -a "$GITHUB_OUTPUT"; exit 0
          fi
          k=$( { grep -E '^base_(suite|mirror|components)=' profiles/desktop.profile
                 sed -n '/^stage_bootstrap()/,/^}/p' build/forge
                 dpkg-query -W debootstrap; } | sha256sum | cut -c1-16)
          echo "key=debootstrap-desktop-$k" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dist/cache/base.tar.zst
          key: ${{ steps.basekey.outputs.key }}
      - name: the base, in this profile's work tree
        run: |
          id=$(sed -n 's/^profile_id="\{0,1\}\([A-Za-z0-9_-]*\)"\{0,1\}.*/\1/p' "profiles/$P.profile" | head -1)
          [ "$id" = "$P" ] || { echo "profile_id '$id' is not '$P'"; exit 1; }
          if [ -f dist/cache/base.tar.zst ]; then
            sudo mkdir -p "work/forge/$P"
            zstd -dc dist/cache/base.tar.zst | sudo tar -C "work/forge/$P" --numeric-owner -xf -
            sudo test -f "work/forge/$P/rootfs/.forge-bootstrapped"
            rm -rf dist/cache
            echo "base from build.yml's cache"
          else
            echo "no cached base: forge debootstraps it (about 10 minutes)"
          fi

      - name: build/all ${{ matrix.profile }}, no browser fallback
        run: |
          T=$(date +%s)
          set +e
          sudo env -u ALLOW_BROWSER_FALLBACK ./build/all "$P" --keep=raw > /tmp/build.log 2>&1
          rc=$?
          set -e
          sed 's/\x1b\[[0-9;]*m//g' /tmp/build.log | gzip -9 > "ev/$P-build.log.gz"
          sed 's/\x1b\[[0-9;]*m//g' /tmp/build.log | tail -60
          echo "build_s=$(( $(date +%s) - T )) rc=$rc" | tee ev/build-time.txt
          exit $rc

      - name: how big it is
        env:
          PROFILE_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          img="out/auros-$P.img"
          raw=$(stat -c %s "$img")
          if [ "${{ needs.gate.outputs.ibus_functional }}" = true ] && [ "$P" = multilingual ]; then
            mkdir -p ev/retained
            packed=ev/retained/auros-multilingual.img.gz
            pigz -9 -p "$(nproc)" -c "$img" > "$packed"
            gz=$(stat -c %s "$packed")
            split -b 94371840 -d -a 3 "$packed" ev/retained/auros-multilingual.img.gz.
            python3 tools/profile_image.py create \
              --image "$img" --gzip "$packed" --pieces ev/retained \
              --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
              --source-sha "$GITHUB_SHA" --output ev/multilingual-image-v1.json
            rm -f "$packed"
          elif [ "$P" = revive ] && [[ "${PROFILE_SUBJECT%%$'\n'*}" == *"[revive-functional]"* ]]; then
            mkdir -p ev/retained-revive
            packed=ev/retained-revive/auros-revive.img.gz
            pigz -9 -p "$(nproc)" -c "$img" > "$packed"
            gz=$(stat -c %s "$packed")
            python3 tools/profiletest-revive.py retain ev/retained-revive --image "$img"
          else
            gz=$(pigz -9 -p "$(nproc)" -c "$img" | wc -c)
          fi
          {
            echo "image_bytes=$raw"
            echo "download_gzip9_bytes=$gz"
            awk -v r="$raw" -v g="$gz" 'BEGIN{printf "summary=image %.2f GiB, download %.2f GiB (gzip -9)\n", r/1073741824, g/1073741824}'
            cat ev/build-time.txt
          } | tee "ev/$P-size.txt"

      - name: boot it to its desktop under KVM
        env:
          PROFILE_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          fcitx_production=0
          revive_functional=0
          if [ "$P" = revive ] && [[ "${PROFILE_SUBJECT%%$'\n'*}" == *"[revive-functional]"* ]]; then
            revive_functional=1
          fi
          if [ "${{ needs.gate.outputs.ibus_functional }}" = true ] && [ "$P" = multilingual ]; then
            fcitx_production=1
          fi
          sudo env PATH="$PATH" PROFILETEST_REVIVE_FUNCTIONAL="$revive_functional" PROFILETEST_FCITX_PRODUCTION="$fcitx_production" \
            sh tools/profiletest.sh boot "$P" "$PWD/ev" 2>&1 | tee "ev/$P-boot.txt"

      # Keep only the exact functional Revive build, including failed probes.
      # This uses the same gzip as size measurement, not a second rebuild.
      - name: retain exact Revive image for bounded diagnostic reuse
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && hashFiles('ev/retained-revive/manifest.json') != '' }}
        with:
          name: profile-revive-runtime-image
          path: ev/retained-revive/
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

      # Upload the small immutable manifest before its mutable release pieces.
      # A later diagnostic trusts this artifact, then checks each release asset.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: profile-${{ matrix.profile }}
          path: |
            ev/
            !ev/retained/
            !ev/retained-revive/
          if-no-files-found: ignore

      - name: publish the evidence
        if: ${{ !cancelled() }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" ev
          cat "ev/$P-size.txt" "ev/$P-image.txt" >> "ev/$P-image.txt.new" 2>/dev/null || true
          [ -f "ev/$P-image.txt.new" ] && mv -f "ev/$P-image.txt.new" "ev/$P-image.txt"
          if [ -d ev/ibus ]; then
            tar -C ev -czf "ev/$P-ibus-evidence.tar.gz" ibus
          fi
          if [ -d ev/revive ]; then
            tar -C ev -czf ev/revive-runtime-evidence.tar.gz revive
          fi
          ls -la ev
          files=()
          for f in "ev/$P.png" "ev/$P-report.txt" "ev/$P-image.txt" "ev/$P-serial.txt" \
                   "ev/$P-boot.txt" "ev/$P-build.log.gz" "ev/$P-size.txt"; do
            [ -f "$f" ] && files+=("$f")
          done
          for f in ev/ibus-round*-candidate.png "ev/$P-ibus-evidence.tar.gz" ev/revive-runtime-evidence.tar.gz; do
            [ -f "$f" ] && files+=("$f")
          done
          [ "${#files[@]}" -gt 0 ] && gh release upload "$TAG" "${files[@]}" --clobber
          # Pieces first and the manifest last: the manifest is the eligibility
          # marker used by pruning, so a partial upload can never replace the
          # preceding complete retained image.
          if [ -f ev/multilingual-image-v1.json ]; then
            pieces=()
            for f in ev/retained/auros-multilingual.img.gz.*; do
              [ -f "$f" ] && pieces+=("$f")
            done
            [ "${#pieces[@]}" -gt 0 ] || { echo "::error::retained image has no pieces"; exit 1; }
            gh release upload "$TAG" "${pieces[@]}" --clobber
            gh release upload "$TAG" ev/multilingual-image-v1.json --clobber
          fi
          {
            echo "### $P"
            echo '```'
            cat "ev/$P-size.txt" 2>/dev/null
            tail -25 "ev/$P-boot.txt" 2>/dev/null
            echo '```'
            echo "screenshot: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$P.png"
          } >> "$GITHUB_STEP_SUMMARY"
  ibus-retest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    timeout-minutes: 75
    concurrency:
      # The same lane as a multilingual build: retention/pruning cannot
      # replace the source while a diagnostic is reading it.
      group: profiles-${{ github.ref }}-multilingual
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: profiles-${{ github.run_id }}
      SOURCE_RUN: ${{ inputs.retained_multilingual_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: accept one diagnostic probe mode
        id: mode
        run: |
          python3 tools/profiletest-gate.py probe-mode \
            --x11 '${{ inputs.x11_panel_probe }}' \
            --fcitx '${{ inputs.fcitx_client_probe }}' \
            --security '${{ inputs.fcitx_security_probe }}' \
            --production-security '${{ inputs.fcitx_production_security_probe }}' \
            --github-output "$GITHUB_OUTPUT"
      - name: accept only one completed main profiles run from this repository
        id: source
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "::error::retained image diagnostics run only from main"; exit 2; }
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]{0,19}$ ]] \
            || { echo "::error::retained_multilingual_run_id must be a decimal Actions run id"; exit 2; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
            > "$RUNNER_TEMP/source-artifacts.json"
          python3 tools/profile_image.py source \
            --run-json "$RUNNER_TEMP/source-run.json" \
            --artifacts-json "$RUNNER_TEMP/source-artifacts.json" \
            --repository "$GITHUB_REPOSITORY" --run-id "$SOURCE_RUN" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ inputs.retained_multilingual_run_id }}
          github-token: ${{ github.token }}
          path: retained-anchor
          merge-multiple: true
      - name: immutable manifest agrees with bounded release assets
        run: |
          [ -f retained-anchor/multilingual-image-v1.json ] \
            || { echo "::error::source artifact has no retained multilingual image manifest"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/profiles-$SOURCE_RUN" \
            > "$RUNNER_TEMP/source-release.json"
          python3 tools/profile_image.py plan \
            --anchor retained-anchor/multilingual-image-v1.json \
            --release-json "$RUNNER_TEMP/source-release.json" \
            --repository "$GITHUB_REPOSITORY" --run-id "$SOURCE_RUN" \
            --source-sha "${{ steps.source.outputs.source_sha }}" \
            --download-plan "$RUNNER_TEMP/download-plan.tsv"
      - name: room, tools, KVM
        run: |
          mkdir -p ev out
          ( sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
              /usr/local/share/chromium /usr/local/julia* 2>/dev/null; echo removed > /tmp/freed ) &
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          for i in 1 2 3; do
            sudo timeout 300 apt-get update -q &&
            sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y -q --no-install-recommends \
              zstd gdisk dosfstools mtools e2fsprogs qemu-system-x86 qemu-utils ovmf python3 && break
            [ "$i" = 3 ] && exit 1; sleep 15
          done
          while [ ! -f /tmp/freed ]; do sleep 2; done
          ls -l /dev/kvm; df -h /
      - name: download and restore the exact retained image
        run: |
          mkdir -p retained-download
          while IFS=$'\t' read -r asset_id name bytes; do
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "retained-download/$name"
            [ "$(stat -c %s "retained-download/$name")" = "$bytes" ] \
              || { echo "::error::release asset $asset_id changed size during download"; exit 1; }
          done < "$RUNNER_TEMP/download-plan.tsv"
          python3 tools/profile_image.py restore \
            --anchor retained-anchor/multilingual-image-v1.json \
            --release-manifest retained-download/multilingual-image-v1.json \
            --pieces retained-download --output out/auros-multilingual.img
      - name: make and verify this diagnostic run's evidence release
        run: |
          mk() { gh release create "$TAG" --prerelease --target "$1" \
                   --title "profiles: retained multilingual diagnostic, run $GITHUB_RUN_ID" \
                   --notes "Diagnostic only. Image: run $SOURCE_RUN. Test code: $GITHUB_SHA."; }
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if ! mk "$GITHUB_SHA"; then
              gh release view "$TAG" >/dev/null 2>&1 ||
                mk main || { echo "::error::could not create diagnostic evidence release $TAG"; exit 1; }
            fi
          fi
          gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "::error::diagnostic evidence release $TAG does not exist"; exit 1; }
      - name: run the current functional harness against the retained image
        id: diagnostic
        run: |
          set +e
          sudo env PATH="$PATH" PROFILETEST_IBUS_FUNCTIONAL="${{ steps.mode.outputs.ibus }}" \
            PROFILETEST_IBUS_X11_PROBE="${{ steps.mode.outputs.x11 }}" \
            PROFILETEST_FCITX_CLIENT_PROBE="${{ steps.mode.outputs.fcitx }}" \
            PROFILETEST_FCITX_SECURITY_PROBE="${{ steps.mode.outputs.security }}" \
            PROFILETEST_FCITX_PRODUCTION="${{ steps.mode.outputs.production }}" \
            sh tools/profiletest.sh boot multilingual "$PWD/ev" 2>&1 | tee ev/multilingual-boot.txt
          rc=${PIPESTATUS[0]}
          set -e
          result=fail; [ "$rc" = 0 ] && result=pass
          python3 tools/profile_image.py diagnostic \
            --anchor retained-anchor/multilingual-image-v1.json \
            --test-run-id "$GITHUB_RUN_ID" --test-source-sha "$GITHUB_SHA" \
            --result "$result" --output ev/multilingual-retest-v1.json
          DIAGNOSTIC_MODE='${{ steps.mode.outputs.mode }}' \
          X11_PANEL_PROBE='${{ steps.mode.outputs.x11 }}' \
          FCITX_CLIENT_PROBE='${{ steps.mode.outputs.fcitx }}' \
          FCITX_SECURITY_PROBE='${{ steps.mode.outputs.security }}' \
          FCITX_PRODUCTION_SECURITY_PROBE='${{ steps.mode.outputs.production }}' python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("ev/multilingual-retest-v1.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          if value.get("schema") != "auros-profile-diagnostic-v1":
              raise SystemExit("unexpected diagnostic provenance schema")
          value["diagnostic_mode"] = os.environ["DIAGNOSTIC_MODE"]
          value["x11_panel_probe"] = os.environ["X11_PANEL_PROBE"] == "1"
          value["fcitx_client_probe"] = os.environ["FCITX_CLIENT_PROBE"] == "1"
          value["fcitx_security_probe"] = os.environ["FCITX_SECURITY_PROBE"] == "1"
          value["fcitx_production_security_probe"] = os.environ["FCITX_PRODUCTION_SECURITY_PROBE"] == "1"
          temporary = path.with_suffix(".json.tmp")
          temporary.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          temporary.replace(path)
          PY
          echo "Diagnostic only (${{ steps.mode.outputs.mode }}): image source ${{ steps.source.outputs.source_sha }}; test source $GITHUB_SHA; result $result" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: publish diagnostic evidence with both source identities
        if: ${{ !cancelled() && (steps.diagnostic.outcome == 'success' || steps.diagnostic.outcome == 'failure') }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" ev
          files=()
          for f in ev/multilingual-retest-v1.json ev/multilingual.png ev/multilingual-report.txt \
                   ev/multilingual-image.txt ev/multilingual-serial.txt ev/multilingual-boot.txt \
                   ev/ibus-round*-candidate.png ev/ibus-x11-before.png ev/ibus-x11-preedit.png \
                   ev/fcitx-mousepad-candidate.png ev/fcitx-mousepad-committed.png \
                   ev/fcitx-firefox-candidate.png ev/fcitx-firefox-submitted.png \
                   ev/fcitx-round*-focus-away.png ev/fcitx-round*-password-focused.png \
                   ev/fcitx-round*-password-masked.png \
                   ev/fcitx-round*-mousepad-b-before.png \
                   ev/fcitx-round*-mousepad-b-after.png \
                   ev/fcitx-round*-mousepad-b-visibility.txt; do
            [ -f "$f" ] && files+=("$f")
          done
          if [ -d ev/ibus ]; then
            tar -C ev -czf ev/multilingual-ibus-evidence.tar.gz ibus
            files+=(ev/multilingual-ibus-evidence.tar.gz)
          fi
          if [ -d ev/fcitx ]; then
            tar -C ev -czf ev/multilingual-fcitx-evidence.tar.gz fcitx
            files+=(ev/multilingual-fcitx-evidence.tar.gz)
          fi
          [ "${#files[@]}" -gt 0 ] && gh release upload "$TAG" "${files[@]}" --clobber
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && !cancelled() }}
        with:
          name: profile-multilingual-diagnostic
          path: ev/
          if-no-files-found: ignore

  summary:
    needs: [gate, profile]
    if: ${{ always() && needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    timeout-minutes: 10
    env:
      TAG: profiles-${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: the table, in the release notes
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || { echo "no release: nothing was built"; exit 0; }
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          {
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (commit ${GITHUB_SHA:0:12})"
            echo
            echo "| profile | result | size | desktop up after | screenshot |"
            echo "|---|---|---|---|---|"
            for p in $(echo '${{ needs.gate.outputs.list }}' | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))'); do
              sz=$(curl -fsSL "$base/$p-size.txt" 2>/dev/null | sed -n 's/^summary=//p')
              bt=$(curl -fsSL "$base/$p-boot.txt" 2>/dev/null | tail -1)
              up=$(curl -fsSL "$base/$p-image.txt" 2>/dev/null | sed -n 's/^desktop_up_after_s=//p' | tail -1)
              echo "| $p | ${bt:-not built} | ${sz:--} | ${up:--} s | [$p.png]($base/$p.png) |"
            done
          } > notes.md
          cat notes.md | tee -a "$GITHUB_STEP_SUMMARY"
          gh release edit "$TAG" --notes-file notes.md

  prune:
    needs: [gate, profile]
    if: ${{ always() && needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    # Publication, retained-image diagnostics, and deletion share one lock.
    # No summary can remove an image while a diagnostic is downloading it.
    concurrency:
      group: profiles-${{ github.ref }}-multilingual
      cancel-in-progress: false
    env:
      TAG: profiles-${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: keep four recent runs and at most one retained multilingual image
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("profiles-")) | [.tag_name,.created_at] | @tsv' |
            sort -t $'\t' -k2,2r | cut -f1 > "$RUNNER_TEMP/profile-tags"
          retained=""
          while read -r t; do
            gh release view "$t" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets" 2>/dev/null || true
            if [ -z "$retained" ] && grep -qx multilingual-image-v1.json "$RUNNER_TEMP/assets"; then
              retained=$t
              continue
            fi
            # Pieces first, the manifest last. If GitHub interrupts cleanup,
            # the next run still sees the manifest and finishes the job.
            { grep -E '^auros-multilingual\.img\.gz\.[0-9]{3}$' "$RUNNER_TEMP/assets" || true; } |
              while read -r asset; do gh release delete-asset "$t" "$asset" --yes; done
            if grep -qx multilingual-image-v1.json "$RUNNER_TEMP/assets"; then
              gh release delete-asset "$t" multilingual-image-v1.json --yes
            fi
          done < "$RUNNER_TEMP/profile-tags"
          tail -n +5 "$RUNNER_TEMP/profile-tags" | while read -r t; do
            [ "$t" = "$TAG" ] && continue
            [ -n "$retained" ] && [ "$t" = "$retained" ] && continue
            gh release delete "$t" --cleanup-tag --yes || true
          done
