# TEMPORARY (stream E): deleted after one run.
name: signprobe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/apt.sh osslsigncode openssl python3
      - run: |
          mkdir -p out
          curl -fsSL -o out/aurbridge-wizard.exe https://github.com/aarohkandy/v0.0.1-auros/releases/download/v0.1.0-618726b/AurOS-Setup.exe
          cp tools/signed-check.sh "$RUNNER_TEMP/signed-check.orig"
          mut() { # name, python replace spec
            cp "$RUNNER_TEMP/signed-check.orig" tools/signed-check.sh
            python3 - "$2" "$3" <<'PY'
          import sys
          s = open("tools/signed-check.sh").read()
          assert sys.argv[1] in s, sys.argv[1]
          open("tools/signed-check.sh", "w").write(s.replace(sys.argv[1], sys.argv[2], 1))
          PY
            echo "=== MUTANT: $1"
            sh tools/signtest.sh 2>&1 | grep -E 'FAIL|[0-9]+ of [0-9]+ wrong|checks:' || true
          }
          mut "no digest comparison" '[ "$du" = "$ds" ] ||' 'false ||'
          mut "no signer-name check" '*"$want"*) ok' '*) ok'
          mut "no signature verification" '|| { sed -n '"'"'1,25p'"'"' "$TMPD/verify.txt" >&2; refuse "the signature does not verify against the trusted roots"; }' '|| true'
          mut "unsigned input not checked" 'if $AC signed "$U" 2>/dev/null; then refuse' 'if false; then refuse'
          mut "signed input not checked" '$AC signed "$S" 2>/dev/null || refuse' '$AC signed "$S" 2>/dev/null || true;#'
          cp "$RUNNER_TEMP/signed-check.orig" tools/signed-check.sh
          echo "=== ORIGINAL"
          sh tools/signtest.sh 2>&1 | grep -E 'FAIL|[0-9]+ of [0-9]+ wrong|checks:' || true
