name: customize

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Strict AurOS recipe v1 JSON
        required: true
        type: string
      base_build_run_id:
        description: Successful build.yml run from this exact main commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: customize-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: validate the recipe and exact green base run
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          AUROS_RECIPE_JSON: ${{ inputs.recipe }}
          BASE_BUILD_RUN_ID: ${{ inputs.base_build_run_id }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "::error::custom packaging must run from main"; exit 2; }
          [[ $BASE_BUILD_RUN_ID =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::base_build_run_id must be a positive Actions run ID"; exit 2; }
          mkdir -p packaging
          python3 tools/customize/base_build.py validate-run \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$BASE_BUILD_RUN_ID" \
            --head-sha "$GITHUB_SHA" \
            --request packaging/request.json \
            --recipe-output packaging/recipe.json \
            --github-output "$GITHUB_OUTPUT"

      # IDs come from the validated run-scoped API response. Names alone are
      # not used, so a later artifact with the same name cannot be substituted.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.base.outputs.installer_artifact_id }}
          path: packaging/base-installer
          merge-multiple: true
          run-id: ${{ steps.base.outputs.base_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.base.outputs.metadata_artifact_id }}
          path: packaging/base-metadata
          merge-multiple: true
          run-id: ${{ steps.base.outputs.base_run_id }}
          github-token: ${{ github.token }}

      - name: cross-check the archived installer and image metadata
        run: |
          python3 tools/customize/base_build.py verify-files \
            --request packaging/request.json \
            --metadata packaging/base-metadata \
            --installer packaging/base-installer/AurOS-Setup.exe \
            --provenance packaging/provenance.json
          python3 tools/pe_payload.py list packaging/base-installer/AurOS-Setup.exe \
            > packaging/base-resources.txt
          for id in 1 2 3 4 5; do
            grep -q "^$id " packaging/base-resources.txt \
              || { echo "::error::trusted base installer has no boot resource $id"; exit 1; }
          done

      - name: bounded installer toolchain
        timeout-minutes: 12
        run: |
          for try in 1 2 3; do
            sudo timeout 150 apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              && sudo timeout 300 apt-get install -y -q \
                   gcc-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64 \
                   mingw-w64-x86-64-dev libxml2-utils sbsigntool \
              && exit 0
            echo "::warning::toolchain try $try did not finish"
            sleep 10
          done
          exit 1

      - name: extract the exact signed boot resources
        run: |
          base=packaging/base-installer/AurOS-Setup.exe
          mkdir -p out
          python3 tools/pe_payload.py get "$base" 1 out/auros-staging-vmlinuz
          python3 tools/pe_payload.py get "$base" 2 out/auros-staging.img
          python3 tools/pe_payload.py get "$base" 3 out/auros-staging-shimx64.efi
          python3 tools/pe_payload.py get "$base" 4 out/auros-staging-grubx64.efi
          python3 tools/pe_payload.py get "$base" 5 out/auros-staging-mmx64.efi
          sbverify --list out/auros-staging-shimx64.efi | grep -q Microsoft \
            || { echo "::error::the reused shim is not signed by Microsoft"; exit 1; }

      - name: rebuild only the personalized installer
        run: |
          export AUROS_RECIPE="$PWD/packaging/recipe.json"
          export AUROS_IMAGE_PROFILE=desktop
          export AUROS_IMAGE_PIECES="$PWD/packaging/base-metadata/pieces.txt"
          AUROS_IMAGE_SHA256=$(tr -d ' \r\n' < packaging/base-metadata/image.sha256)
          AUROS_IMAGE_BYTES=$(tr -d ' \r\n' < packaging/base-metadata/image.bytes)
          AUROS_VERSION=$(sed -n 's/^os_version="\{0,1\}\([0-9A-Za-z.+-]*\)"\{0,1\}.*/\1/p' profiles/desktop.profile | head -1)
          [[ $AUROS_VERSION =~ ^[0-9]+[.][0-9]+[.][0-9]+[0-9A-Za-z.+-]*$ ]] \
            || { echo "::error::desktop profile has no valid os_version"; exit 1; }
          export AUROS_IMAGE_SHA256 AUROS_IMAGE_BYTES AUROS_VERSION
          AUROS_RELEASE=1 sh build/aurbridge
          recipe_id=$(python3 -c 'import json; print(json.load(open("packaging/request.json"))["recipe"]["id"])')
          strings out/aurbridge-wizard.exe | grep -Fx "$recipe_id" \
            || { echo "::error::custom wizard does not carry the validated recipe identity"; exit 1; }
          python3 tools/pe_payload.py list out/aurbridge-setup.exe > packaging/custom-resources.txt
          for id in 1 2 3 4 5; do
            grep -q "^$id " packaging/custom-resources.txt \
              || { echo "::error::custom installer has no boot resource $id"; exit 1; }
            python3 tools/pe_payload.py get out/aurbridge-setup.exe "$id" "packaging/custom-resource-$id"
            case "$id" in
              1) source=out/auros-staging-vmlinuz ;;
              2) source=out/auros-staging.img ;;
              3) source=out/auros-staging-shimx64.efi ;;
              4) source=out/auros-staging-grubx64.efi ;;
              5) source=out/auros-staging-mmx64.efi ;;
            esac
            cmp "$source" "packaging/custom-resource-$id" \
              || { echo "::error::custom installer changed boot resource $id"; exit 1; }
          done
          sh tools/manifesttest.sh out/aurbridge-setup.exe

      - name: record the unsigned custom artifact truthfully
        run: |
          mkdir -p dist/custom
          cp out/aurbridge-setup.exe dist/custom/AurOS-Setup.exe
          cp out/aurbridge-wizard.exe dist/custom/aurbridge-wizard.exe
          cp packaging/provenance.json dist/custom/provenance.json
          python3 tools/customize/base_build.py finish \
            --provenance dist/custom/provenance.json \
            --installer dist/custom/AurOS-Setup.exe \
            --build-info dist/custom/build-info.txt \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
          {
            echo '### Unsigned custom packaging output'
            echo 'This artifact is not signed, published, or download-ready.'
            echo 'It reuses the exact image and signed boot resources identified in provenance.json.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auros-custom-unsigned
          path: dist/custom/
          retention-days: 7
          if-no-files-found: error

  # The unsigned artifact is always retained. If the owner has configured
  # SignPath, the shared workflow signs the inner wizard, rebuilds the
  # protected bootstrap around those bytes, and signs the outer file.
  sign:
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    needs: package
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sign-installer.yml
    with:
      run-id: ${{ github.run_id }}
      installer-artifact: auros-custom-unsigned
      custom-package: true
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
