name: customize
run-name: customize ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Strict AurOS recipe v1 JSON
        required: true
        type: string
      authority_sha:
        description: Current main commit selected by the build service
        required: true
        type: string
      base_build_run_id:
        description: Exact successful build.yml run whose base is reused
        required: true
        type: string
      base_build_sha:
        description: Exact source commit of the reused base build
        required: true
        type: string
      base_build_tag:
        description: Release asset namespace recorded by the reused base build
        required: true
        type: string
      request_id:
        description: Optional opaque request UUID used only to correlate this run
        required: false
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: customize-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      recipe_id: ${{ steps.recipe.outputs.recipe_id }}
      expected_look: ${{ steps.recipe.outputs.expected_look }}
      expected_theme: ${{ steps.recipe.outputs.expected_theme }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: validate the recipe and exact green base run
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          AUROS_RECIPE_JSON: ${{ inputs.recipe }}
          AUTHORITY_SHA: ${{ inputs.authority_sha }}
          BASE_BUILD_RUN_ID: ${{ inputs.base_build_run_id }}
          BASE_BUILD_SHA: ${{ inputs.base_build_sha }}
          BASE_BUILD_TAG: ${{ inputs.base_build_tag }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "::error::custom packaging must run from current main authority"; exit 2; }
          [[ $AUTHORITY_SHA =~ ^[0-9a-f]{40}$ ]] && [ "$AUTHORITY_SHA" = "$GITHUB_SHA" ] \
            || { echo "::error::workflow authority does not match the selected main commit"; exit 2; }
          python3 tools/customize/delivery.py validate-request-id --request-id "$REQUEST_ID"
          [[ $BASE_BUILD_RUN_ID =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::base_build_run_id must be a positive Actions run ID"; exit 2; }
          [[ $BASE_BUILD_SHA =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::base_build_sha must be one full lowercase commit SHA"; exit 2; }
          [[ $BASE_BUILD_TAG =~ ^v[0-9A-Za-z.+-]+-[0-9a-f]{7}$ ]] \
            || { echo "::error::base_build_tag must be a strict AurOS release tag"; exit 2; }
          [ "${BASE_BUILD_TAG##*-}" = "${BASE_BUILD_SHA:0:7}" ] \
            || { echo "::error::base_build_tag suffix does not match base_build_sha"; exit 2; }
          mkdir -p packaging
          python3 tools/customize/base_build.py validate-run \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$BASE_BUILD_RUN_ID" \
            --head-sha "$BASE_BUILD_SHA" \
            --authority-sha "$GITHUB_SHA" \
            --request packaging/request.json \
            --recipe-output packaging/recipe.json \
            --github-output "$GITHUB_OUTPUT"

      # IDs come from the validated run-scoped API response. Names alone are
      # not used, so a later artifact with the same name cannot be substituted.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.base.outputs.installer_artifact_id }}
          path: packaging/base-installer
          merge-multiple: true
          run-id: ${{ steps.base.outputs.base_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.base.outputs.metadata_artifact_id }}
          path: packaging/base-metadata
          merge-multiple: true
          run-id: ${{ steps.base.outputs.base_run_id }}
          github-token: ${{ github.token }}

      - name: cross-check the archived installer and image metadata
        run: |
          python3 tools/customize/base_build.py verify-files \
            --request packaging/request.json \
            --metadata packaging/base-metadata \
            --installer packaging/base-installer/AurOS-Setup.exe \
            --provenance packaging/provenance.json
          python3 - "$BASE_BUILD_TAG" <<'PY'
          import json
          import sys

          with open("packaging/provenance.json", encoding="utf-8") as stream:
              proven = json.load(stream)["base_build"]["tag"]
          if proven != sys.argv[1]:
              raise SystemExit("explicit base_build_tag does not match validated base metadata")
          PY
          python3 tools/customize/delivery.py validate-source-ref \
            --ref "$GITHUB_REF" --source-sha "$GITHUB_SHA" \
            --provenance packaging/provenance.json
          python3 tools/pe_payload.py list packaging/base-installer/AurOS-Setup.exe \
            > packaging/base-resources.txt
          for id in 1 2 3 4 5; do
            grep -q "^$id " packaging/base-resources.txt \
              || { echo "::error::trusted base installer has no boot resource $id"; exit 1; }
          done

      - name: expose the validated recipe expectations
        id: recipe
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          with open("packaging/request.json", encoding="utf-8") as stream:
              recipe = json.load(stream)["recipe"]
          recipe_id = recipe["id"]
          preferences = recipe["resolved_preferences"]
          look = preferences["look"]
          theme = preferences["theme"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", recipe_id):
              raise SystemExit("validated recipe has an invalid identity")
          if look not in {"dock", "rail", "taskbar", "tiles"}:
              raise SystemExit("validated recipe has an invalid look")
          if theme not in {"ember", "moss", "nocturne", "sandstone", "slate"}:
              raise SystemExit("validated recipe has an invalid theme")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"recipe_id={recipe_id}\n")
              output.write(f"expected_look={look}\n")
              output.write(f"expected_theme={theme}\n")
          PY

      - name: bounded installer toolchain
        timeout-minutes: 12
        run: |
          for try in 1 2 3; do
            sudo timeout 150 apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              && sudo timeout 300 apt-get install -y -q \
                   gcc-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64 \
                   mingw-w64-x86-64-dev libxml2-utils sbsigntool \
              && exit 0
            echo "::warning::toolchain try $try did not finish"
            sleep 10
          done
          exit 1

      - name: extract the exact signed boot resources
        run: |
          base=packaging/base-installer/AurOS-Setup.exe
          mkdir -p out
          python3 tools/pe_payload.py get "$base" 1 out/auros-staging-vmlinuz
          python3 tools/pe_payload.py get "$base" 2 out/auros-staging.img
          python3 tools/pe_payload.py get "$base" 3 out/auros-staging-shimx64.efi
          python3 tools/pe_payload.py get "$base" 4 out/auros-staging-grubx64.efi
          python3 tools/pe_payload.py get "$base" 5 out/auros-staging-mmx64.efi
          sbverify --list out/auros-staging-shimx64.efi | grep -q Microsoft \
            || { echo "::error::the reused shim is not signed by Microsoft"; exit 1; }

      - name: rebuild only the personalized installer
        run: |
          export AUROS_RECIPE="$PWD/packaging/recipe.json"
          export AUROS_IMAGE_PROFILE=desktop
          export AUROS_IMAGE_PIECES="$PWD/packaging/base-metadata/pieces.txt"
          AUROS_IMAGE_SHA256=$(tr -d ' \r\n' < packaging/base-metadata/image.sha256)
          AUROS_IMAGE_BYTES=$(tr -d ' \r\n' < packaging/base-metadata/image.bytes)
          AUROS_VERSION=$(python3 - <<'PY'
          import json
          import re

          with open("packaging/provenance.json", encoding="utf-8") as stream:
              tag = json.load(stream)["base_build"]["tag"]
          match = re.fullmatch(r"v([0-9A-Za-z.+-]+)-[0-9a-f]{7}", tag)
          if not match:
              raise SystemExit("validated base provenance has no usable AurOS version")
          print(match.group(1))
          PY
          )
          [[ $AUROS_VERSION =~ ^[0-9]+[.][0-9]+[.][0-9]+[0-9A-Za-z.+-]*$ ]] \
            || { echo "::error::validated base has no valid os_version"; exit 1; }
          export AUROS_IMAGE_SHA256 AUROS_IMAGE_BYTES AUROS_VERSION
          AUROS_RELEASE=1 sh build/aurbridge
          recipe_id=$(python3 -c 'import json; print(json.load(open("packaging/request.json"))["recipe"]["id"])')
          strings out/aurbridge-wizard.exe | grep -Fx "$recipe_id" \
            || { echo "::error::custom wizard does not carry the validated recipe identity"; exit 1; }
          python3 tools/pe_payload.py list out/aurbridge-setup.exe > packaging/custom-resources.txt
          for id in 1 2 3 4 5; do
            grep -q "^$id " packaging/custom-resources.txt \
              || { echo "::error::custom installer has no boot resource $id"; exit 1; }
            python3 tools/pe_payload.py get out/aurbridge-setup.exe "$id" "packaging/custom-resource-$id"
            case "$id" in
              1) source=out/auros-staging-vmlinuz ;;
              2) source=out/auros-staging.img ;;
              3) source=out/auros-staging-shimx64.efi ;;
              4) source=out/auros-staging-grubx64.efi ;;
              5) source=out/auros-staging-mmx64.efi ;;
            esac
            cmp "$source" "packaging/custom-resource-$id" \
              || { echo "::error::custom installer changed boot resource $id"; exit 1; }
          done
          sh tools/manifesttest.sh out/aurbridge-setup.exe

      - name: record the unsigned custom artifact truthfully
        run: |
          mkdir -p dist/custom
          cp out/aurbridge-setup.exe dist/custom/AurOS-Setup.exe
          cp out/aurbridge-wizard.exe dist/custom/aurbridge-wizard.exe
          cp packaging/provenance.json dist/custom/provenance.json
          python3 tools/customize/base_build.py finish \
            --provenance dist/custom/provenance.json \
            --installer dist/custom/AurOS-Setup.exe \
            --build-info dist/custom/build-info.txt \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
          {
            echo '### Unsigned custom packaging output'
            echo 'This artifact is not signed, published, or download-ready.'
            echo 'It reuses the exact image and signed boot resources identified in provenance.json.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auros-custom-unsigned
          path: dist/custom/
          retention-days: 7
          if-no-files-found: error

  # The unsigned artifact is always retained. If the owner has configured
  # SignPath, the shared workflow signs the inner wizard, rebuilds the
  # protected bootstrap around those bytes, and signs the outer file.
  sign:
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    needs: package
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sign-installer.yml
    with:
      run-id: ${{ github.run_id }}
      installer-artifact: auros-custom-unsigned
      custom-package: true
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  certify:
    if: ${{ needs.sign.result == 'success' }}
    needs: [package, sign]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/e2e.yml
    with:
      installer_artifact: auros-setup-signed
      installer_sha256: ${{ needs.sign.outputs.signed_sha256 }}
      variants: base
      expected_recipe_id: ${{ needs.package.outputs.recipe_id }}
      expected_look: ${{ needs.package.outputs.expected_look }}
      expected_theme: ${{ needs.package.outputs.expected_theme }}

  # A ready manifest is impossible without the shared signer's successful,
  # same-run two-layer signing evidence. This job only adds immutable assets to
  # the already-tested base prerelease; it never creates, edits, or promotes it.
  publish:
    name: publish
    if: ${{ needs.sign.result == 'success' && needs.certify.result == 'success' && needs.certify.outputs.certified == 'true' }}
    needs: [package, sign, certify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REQUEST_ID: ${{ inputs.request_id }}
      EXPECTED_SIGNED_SHA: ${{ needs.sign.outputs.signed_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: auros-setup-signed
          path: delivery/signed
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: verify signed delivery against its exact tested base
        id: delivery
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("delivery/signed/custom-package-provenance.json"))["base_build"]["tag"])')
          [[ $tag =~ ^v[0-9A-Za-z.+-]+-[0-9a-f]{7}$ ]] \
            || { echo "::error::signed provenance has an invalid base tag"; exit 2; }
          mkdir -p delivery/base delivery/publish
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > delivery/base/release.json
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern pieces.txt --pattern image.sha256 --pattern image.bytes \
            --dir delivery/base
          python3 tools/customize/delivery.py prepare \
            --provenance delivery/signed/custom-package-provenance.json \
            --signing-provenance delivery/signed/signing-provenance.txt \
            --installer delivery/signed/AurOS-Setup.exe \
            --release delivery/base/release.json \
            --pieces delivery/base/pieces.txt \
            --image-sha delivery/base/image.sha256 \
            --image-bytes delivery/base/image.bytes \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --signed-sha256 "$EXPECTED_SIGNED_SHA" \
            --request-id "$REQUEST_ID" \
            --output-dir delivery/publish \
            --github-output "$GITHUB_OUTPUT"

      - name: publish and read back the signed executable
        env:
          TAG: ${{ steps.delivery.outputs.tag }}
          INSTALLER_NAME: ${{ steps.delivery.outputs.installer_name }}
          INSTALLER_EXISTS: ${{ steps.delivery.outputs.installer_exists }}
        run: |
          if [ "$INSTALLER_EXISTS" != true ]; then
            if ! gh release upload "$TAG" "delivery/publish/$INSTALLER_NAME" \
              --repo "$GITHUB_REPOSITORY"; then
              echo "::warning::installer upload raced or failed; exact readback must now prove it"
            fi
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > delivery/exe-release.json
          mkdir delivery/exe-readback
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$INSTALLER_NAME" --dir delivery/exe-readback
          python3 tools/customize/delivery.py make-manifest \
            --plan delivery/publish/delivery-plan.json \
            --release delivery/exe-release.json \
            --readback-installer "delivery/exe-readback/$INSTALLER_NAME" \
            --output "delivery/publish/${INSTALLER_NAME%.exe}.json"

      - name: publish the bounded manifest and verify both public assets
        env:
          TAG: ${{ steps.delivery.outputs.tag }}
          INSTALLER_NAME: ${{ steps.delivery.outputs.installer_name }}
          MANIFEST_NAME: ${{ steps.delivery.outputs.manifest_name }}
          MANIFEST_EXISTS: ${{ steps.delivery.outputs.manifest_exists }}
        run: |
          if [ "$MANIFEST_EXISTS" != true ]; then
            if ! gh release upload "$TAG" "delivery/publish/$MANIFEST_NAME" \
              --repo "$GITHUB_REPOSITORY"; then
              echo "::warning::manifest upload raced or failed; exact readback must now prove it"
            fi
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > delivery/final-release.json
          mkdir delivery/final-readback
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$INSTALLER_NAME" --pattern "$MANIFEST_NAME" \
            --dir delivery/final-readback
          url=$(python3 tools/customize/delivery.py verify-ready \
            --plan delivery/publish/delivery-plan.json \
            --release delivery/final-release.json \
            --expected-manifest "delivery/publish/$MANIFEST_NAME" \
            --readback-manifest "delivery/final-readback/$MANIFEST_NAME" \
            --expected-installer "delivery/publish/$INSTALLER_NAME" \
            --readback-installer "delivery/final-readback/$INSTALLER_NAME")
          {
            echo '### Personalized installer is download-ready'
            echo "Signed executable: $url"
            echo "Delivery manifest: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$MANIFEST_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

      # This one-file, same-run artifact is immutable after upload. The cloud
      # compares its exact manifest bytes with the mutable release asset before
      # returning the EXE URL.
      - name: preserve the verified ready manifest with this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auros-custom-delivery
          path: delivery/final-readback/${{ steps.delivery.outputs.manifest_name }}
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
