# The rules every workflow keeps (tools/workflowlint.py): each file parses,
# each job that runs steps has timeout-minutes, no apt-get is unbounded.
# Runs only when a workflow (or the lint, or tools/apt.sh) changes: a
# file that does not parse also stops every workflow that calls it, so
# it is told at once, in plain words, instead of as "workflow file issue".
name: workflowlint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/workflowlint.py'
      - 'tools/apt.sh'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/apt.sh python3-yaml
      - run: python3 -I tools/workflowlint.py selftest
      - run: python3 -I tools/workflowlint.py
