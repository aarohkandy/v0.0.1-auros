# The website (website/), on GitHub Pages:
#   https://<owner>.github.io/<repository>/
#
# The folder names no repository: tools/site/stamp.sh writes in the one
# this workflow runs in (${{ github.repository }}), so a move to another
# repository edits nothing here. The stamped copy is checked the way she
# meets it (tools/site/check.mjs: the "Get AurOS" button on the first
# screen, its address, text size and contrast, every link, the message
# for Macs, phones and ARM PCs, no request to any other server), and that
# same copy is published.
#
# Not while the download is missing: the front door's one button goes to
# releases/latest/download/AurOS-Setup.exe (the href of #get in
# index.html), and a page whose only button is a 404 is worse than the
# old page. Until a full (not pre-) release carries that file, the check
# passes and the deploy is skipped with a warning saying so. A release
# published by another workflow's GITHUB_TOKEN starts no workflow here,
# so after the first [latest] release, run this one (Actions -> pages ->
# Run workflow, or `gh workflow run pages.yml --ref <branch>`).
#
# Once, by the owner: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". If the github-pages environment only lets
# the default branch deploy, also add this branch under Settings ->
# Environments -> github-pages -> Deployment branches and tags.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'tools/site/**'
      - 'tools/repo.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The owner's domain (docs/ops/DOMAIN.md): the site is stamped with it, and the
# Get AurOS button goes to get.<domain>. Empty until he sets the variable.
env:
  AUROS_DOMAIN: ${{ vars.AUROS_DOMAIN }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      download: ${{ steps.download.outputs.ok }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          pw="$RUNNER_TEMP/pw/node_modules/.bin/playwright"
          "$pw" install chromium
          # Chromium's system libraries are usually on the runner image already. Installing them
          # (--with-deps runs apt) took ten minutes of a fifteen-minute job on a slow mirror
          # (runs 40018977591, 40024591226), while the check itself takes under a minute. So: only
          # when Chromium will not start, and bounded.
          if ! NODE_PATH="$RUNNER_TEMP/pw/node_modules" node -e "require('playwright').chromium.launch().then(b => b.close())"; then
            timeout 600 "$pw" install --with-deps chromium
          fi
      - name: The site, with this repository written in
        run: sh tools/site/stamp.sh website "$RUNNER_TEMP/site"
      - name: Check the front door
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw
        run: node tools/site/check.mjs --dir "$RUNNER_TEMP/site"
      - name: Is the download there?
        id: download
        run: |
          url=$(grep -o 'id="get" href="[^"]*"' "$RUNNER_TEMP/site/index.html" | head -1 | sed 's/.*href="//; s/"$//')
          if [ -z "$url" ]; then echo "::error::no #get link in website/index.html"; exit 1; fi
          # get.<domain> may be shut on purpose (a wave that is full or not yet open): what must exist is the file itself.
          if [ -n "$AUROS_DOMAIN" ]; then url=$(env -u AUROS_DOMAIN sh tools/repo.sh get); fi
          # GitHub redirects to a signed address that may refuse HEAD;
          # ask for the first byte, as a browser would ask for the file.
          code=$(curl -sSL -r 0-0 -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$url" || true)
          if [ "$code" = 200 ] || [ "$code" = 206 ]; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
            echo "$url answers $code"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
            msg="$url answers ${code:-nothing}. The front door's only download would be a 404, so the website is not published. Publish a full (not pre-) release with AurOS-Setup.exe, then run this workflow again."
            echo "::warning title=Website not deployed::$msg"
            { echo "### Website not deployed"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.download == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The public site is not put up while the legal pack is not ready (stream LEGAL: the owner's
      # mailbox, the installer's agreement line and Licenses button, the reviews). It says what is missing.
      - name: The legal pack is ready for the public (tools/legal/check.py --launch)
        run: python3 -I tools/legal/check.py --launch
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: The site, with this repository written in
        run: sh tools/site/stamp.sh website "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
